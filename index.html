<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090611">
<title>给你的一瓶星星 ✦</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090611;color:#f5eadb;font-family:"Noto Serif SC","PingFang SC","Microsoft YaHei",serif}
button,textarea{font:inherit}button{cursor:pointer}textarea{resize:none}
#sky{position:fixed;inset:0;background:radial-gradient(circle at 50% 75%,#382346 0,#171024 38%,#090611 100%);transition:background 1s;z-index:0}
#stars{position:fixed;inset:0;pointer-events:none;z-index:1}
.bgstar{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.15;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.85;transform:scale(1.8)}}
#gift{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#2b203b 0,#100b17 55%,#08050d 100%);transition:.8s}
#gift.hide{opacity:0;visibility:hidden}
.gcard{text-align:center;width:min(90%,430px)}
.gstar{font-size:76px;filter:drop-shadow(0 0 28px #f4d26a);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(5deg)}}
.gcard h1{font-size:42px;font-weight:400;letter-spacing:5px;margin:15px 0 20px}.gcard p{color:#c9bbca;line-height:2;letter-spacing:1px}
.pill{border:1px solid #a88968;background:#ffffff08;color:#f4e7d5;border-radius:999px;padding:13px 34px;margin-top:22px}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#top{position:fixed;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;color:#c9b9c9;font-size:13px;z-index:5}
#bottleWrap{position:relative;width:min(390px,88vw);height:min(600px,72vh);filter:drop-shadow(0 22px 35px #0008)}
#bottle{position:absolute;inset:0;width:100%;height:100%}
#bottleGlass{fill:#ffffff08;stroke:#d9c7e855;stroke-width:3}
#bottleGlow{fill:none;stroke:#ffffff2b;stroke-width:10}
#phys{position:absolute;left:12%;right:12%;top:25%;bottom:7%;border-radius:42% 42% 18% 18%/17% 17% 8% 8%;overflow:hidden;pointer-events:none}
.pstar{position:absolute;width:18px;height:18px;transform:translate(-50%,-50%);clip-path:polygon(50% 0,61% 35%,100% 35%,69% 57%,81% 100%,50% 73%,19% 100%,31% 57%,0 35%,39% 35%);filter:drop-shadow(0 0 6px currentColor)}
#count{margin-top:8px;color:#c7b6c7}#count b{color:#f0cf6b}
#actions{display:flex;gap:10px;margin-top:14px}
.small{background:#ffffff09;border:1px solid #a8896840;color:#e9dccb;border-radius:20px;padding:8px 16px}
#compose{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:#07050dcc;backdrop-filter:blur(10px)}
#compose.open{display:flex}
.sheet{width:min(600px,94vw);height:min(700px,92vh);background:#f7efe2;color:#30262d;border-radius:26px;padding:22px;box-shadow:0 25px 80px #0008;position:relative;overflow:hidden}
.sheet h2{font-weight:400;text-align:center;margin:2px 0 16px}
.emotions{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.em{border:1px solid #b8a8a044;background:#fff8;border-radius:14px;padding:8px 3px;font-size:12px;color:#40343b}.em.active{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 22%,transparent);background:color-mix(in srgb,var(--c) 9%,white)}
.swatch{width:19px;height:19px;border-radius:50%;margin:0 auto 5px;background:var(--c);box-shadow:0 0 9px var(--c)}
#letter{width:100%;height:300px;border:0;outline:0;background:transparent;color:#332831;font-size:17px;line-height:2;padding:8px 4px}
.sign{display:flex;justify-content:center;gap:10px;margin:10px 0}.sign button{border:1px solid #b8a8a0;background:#fff8;border-radius:999px;padding:8px 18px}.sign button.active{background:#3b2b38;color:#fff;border-color:#3b2b38}
.row{display:flex;justify-content:center;gap:10px}.primary{background:#3b2b38;color:white;border:0;border-radius:999px;padding:11px 25px}.close{background:transparent;border:1px solid #a99;color:#55434c;border-radius:999px;padding:10px 20px}
#effects{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .35s}
#effects.on{opacity:1}
.rain{position:absolute;top:-20%;width:1px;height:80px;background:linear-gradient(transparent,#b9d9ff);opacity:.48;animation:rain linear infinite}
@keyframes rain{to{transform:translateY(140vh) translateX(-12vw)}}
.ember{position:absolute;width:5px;height:14px;border-radius:50%;background:#ff654d;box-shadow:0 0 10px #ff4b3b;animation:up linear infinite}
@keyframes up{to{transform:translateY(-110vh) scale(.1);opacity:0}}
.dust{position:absolute;width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 14px currentColor;animation:drift linear infinite}
@keyframes drift{50%{transform:translate(30px,-30px) scale(1.6)}100%{transform:translate(-20px,-100vh);opacity:0}}
.wave{position:absolute;border:1px solid currentColor;border-radius:50%;width:20px;height:20px;animation:wave 4s ease-out infinite}
@keyframes wave{to{width:80vw;height:80vw;opacity:0;transform:translate(-40%,-40%)}}
.wind{position:absolute;width:35vw;height:1px;background:linear-gradient(90deg,transparent,currentColor,transparent);animation:wind 1.5s linear infinite}
@keyframes wind{from{transform:translateX(-60vw)}to{transform:translateX(160vw)}}
#saved{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;background:#08050de8;backdrop-filter:blur(10px);padding:20px}
#saved.open{display:flex}.savedbox{width:min(600px,94vw);max-height:82vh;overflow:auto;background:#f7efe2;color:#332831;border-radius:24px;padding:24px}
.note{padding:15px 0;border-bottom:1px solid #d9cbbd}.note:last-child{border:0}.tag{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;background:var(--c);color:#fff}.sig{float:right;color:#88727c}
@media(max-width:520px){.emotions{grid-template-columns:repeat(3,1fr)}#letter{height:330px}.sheet{padding:18px}.gcard h1{font-size:34px}#bottleWrap{height:66vh}}
</style>
</head>
<body>
<div id="sky"></div><div id="stars"></div>
<div id="effects"></div>
<section id="gift"><div class="gcard"><div class="gstar">✦</div><h1>给你的一瓶星星</h1><p>有些话，想说给你听。<br>所以我把它们一颗一颗，放进这里。</p><button class="pill" id="enter">打开看看 ✦</button></div></section>
<main id="app">
<div id="top"><span id="date"></span><span>Ink × Yyi</span></div>
<div id="bottleWrap">
<svg id="bottle" viewBox="0 0 390 600" preserveAspectRatio="none">
<defs><linearGradient id="glass" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".18"/><stop offset=".45" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#b99be0" stop-opacity=".13"/></linearGradient></defs>
<path d="M142 50h106v65c0 12 50 35 62 65 10 16 14 38 14 67v267c0 43-24 68-67 68H133c-43 0-67-25-67-68V247c0-29 4-51 14-67 12-30 62-53 62-65V50z" fill="url(#glass)" stroke="#d9c7e855" stroke-width="3"/>
<path d="M147 50h96v72c0 16 42 32 57 63 8 16 11 35 11 61v262c0 34-18 50-54 50H133c-36 0-54-16-54-50V246c0-26 3-45 11-61 15-31 57-47 57-63V50z" fill="none" stroke="#fff2" stroke-width="9"/>
<rect x="135" y="31" width="120" height="30" rx="10" fill="#c4a36f" opacity=".85"/><rect x="145" y="21" width="100" height="15" rx="6" fill="#806544"/>
<path d="M88 225c10-44 40-57 62-76" fill="none" stroke="#fff4" stroke-width="7" stroke-linecap="round"/>
</svg><div id="phys"></div></div>
<div id="count">瓶中有 <b>0</b> 颗星星</div><div id="actions"><button class="small" id="write">写一封星星信 ✦</button><button class="small" id="letters">看信件</button><button class="small" id="shake">摇一摇</button></div>
</main>

<section id="compose"><div class="sheet"><button id="x" class="close" style="float:right">×</button><h2>写一封星星信</h2>
<div class="emotions" id="emotions"></div>
<textarea id="letter" maxlength="5000" placeholder="想对 TA 说些什么……"></textarea>
<div class="sign"><button data-sig="Ink" class="active">Ink 写的</button><button data-sig="Yyi">Yyi 写的</button></div>
<div class="row"><button class="close" id="cancel">放下这封信</button><button class="primary" id="fold">折成星星 ✦</button></div>
</div></section>
<section id="saved"><div class="savedbox"><button id="closeSaved" class="close" style="float:right">×</button><h2>收集的星星</h2><div id="notes"></div></div></section>

<script>
const emotions=[
{name:'开心',c:'#f4d24f',type:'dust'},
{name:'难过',c:'#78a9df',type:'rain'},
{name:'生气',c:'#ef5a4f',type:'ember'},
{name:'平静',c:'#79c8b1',type:'wave'},
{name:'焦虑',c:'#b58bd8',type:'wind'},
{name:'想念',c:'#8c78e8',type:'dust'}
];
let selected=0, signature='Ink', effectTimer=null, audioCtx=null, rainGain=null, noiseGain=null;
const $=id=>document.getElementById(id);
function makeStars(){for(let i=0;i<100;i++){let s=document.createElement('i');s.className='bgstar';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*4+'s';s.style.animationDuration=2+Math.random()*4+'s';$('stars').appendChild(s)}}
function setDate(){let d=new Date();$('date').textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}
function renderEmotions(){ $('emotions').innerHTML=emotions.map((e,i)=>`<button class="em ${i===selected?'active':''}" style="--c:${e.c}" data-i="${i}"><div class="swatch"></div>${e.name}</button>`).join('');document.querySelectorAll('.em').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;renderEmotions();startEffect()})}
function clearEffect(){clearInterval(effectTimer);effectTimer=null;$('effects').innerHTML='';$('effects').classList.remove('on');stopRainAudio()}
function startEffect(){clearEffect();let e=emotions[selected], box=$('effects');box.classList.add('on');box.style.color=e.c;
if(e.type==='rain'){for(let i=0;i<150;i++){let x=document.createElement('i');x.className='rain';x.style.left=Math.random()*100+'%';x.style.animationDuration=.35+Math.random()*.55+'s';x.style.animationDelay=-Math.random()*1.2+'s';x.style.height=35+Math.random()*70+'px';box.appendChild(x)}startRainAudio()}
if(e.type==='ember'){for(let i=0;i<45;i++){let x=document.createElement('i');x.className='ember';x.style.left=Math.random()*100+'%';x.style.top=(70+Math.random()*35)+'%';x.style.animationDuration=1.5+Math.random()*2.5+'s';x.style.animationDelay=-Math.random()*3+'s';box.appendChild(x)}}
if(e.type==='dust'){for(let i=0;i<55;i++){let x=document.createElement('i');x.className='dust';x.style.left=Math.random()*100+'%';x.style.top=(30+Math.random()*70)+'%';x.style.color=e.c;x.style.animationDuration=3+Math.random()*5+'s';x.style.animationDelay=-Math.random()*5+'s';box.appendChild(x)}}
if(e.type==='wave'){for(let i=0;i<9;i++){let x=document.createElement('i');x.className='wave';x.style.left=(Math.random()*100)+'%';x.style.top=(30+Math.random()*70)+'%';x.style.color=e.c;x.style.animationDelay=-Math.random()*4+'s';box.appendChild(x)}}
if(e.type==='wind'){for(let i=0;i<18;i++){let x=document.createElement('i');x.className='wind';x.style.left='-20vw';x.style.top=Math.random()*100+'%';x.style.color=e.c;x.style.animationDelay=-Math.random()*2+'s';box.appendChild(x)}}
}
function startRainAudio(){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();let buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate),d=buffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.28;let src=audioCtx.createBufferSource();src.buffer=buffer;src.loop=true;rainGain=audioCtx.createGain();rainGain.gain.value=.075;src.connect(rainGain).connect(audioCtx.destination);src.start();
let o=audioCtx.createOscillator();o.type='sine';o.frequency.value=110;noiseGain=audioCtx.createGain();noiseGain.gain.value=.018;o.connect(noiseGain).connect(audioCtx.destination);o.start()}catch(e){}}
function stopRainAudio(){if(audioCtx){try{audioCtx.close()}catch(e){}audioCtx=null}}
function stars(){return JSON.parse(localStorage.getItem('yyi_stars')||'[]')}
function saveStars(a){localStorage.setItem('yyi_stars',JSON.stringify(a))}
function renderBottle(){let box=$('phys'),a=stars();box.innerHTML='';a.forEach((s,i)=>{let el=document.createElement('i');el.className='pstar';el.style.color=s.color;el.style.background=s.color;el.style.left=s.x+'%';el.style.top=s.y+'%';el.style.transform=`translate(-50%,-50%) rotate(${s.r}deg)`;box.appendChild(el)});$('count').innerHTML=`瓶中有 <b>${a.length}</b> 颗星星`}
function addStar(color){let a=stars();let n=a.length,cols=7, row=Math.floor(n/cols),col=n%cols;let x=12+col*12+(row%2)*5,y=88-row*7; a.push({color,x:Math.min(88,x),y:Math.max(12,y),r:Math.random()*360});saveStars(a);renderBottle()}
function openCompose(){signature='Ink';document.querySelectorAll('.sign button').forEach(b=>b.classList.toggle('active',b.dataset.sig==='Ink'));$('letter').value='';$('compose').classList.add('open');renderEmotions();startEffect();$('letter').focus()}
function closeCompose(){clearEffect();$('compose').classList.remove('open')}
function saveLetter(){let text=$('letter').value.trim();if(!text)return;let a=JSON.parse(localStorage.getItem('yyi_letters')||'[]');a.unshift({text,emotion:emotions[selected].name,color:emotions[selected].c,signature,date:new Date().toLocaleString('zh-CN')});localStorage.setItem('yyi_letters',JSON.stringify(a));addStar(emotions[selected].c);closeCompose()}
function renderNotes(){let a=JSON.parse(localStorage.getItem('yyi_letters')||'[]');$('notes').innerHTML=a.length?a.map(n=>`<article class="note"><span class="tag" style="--c:${n.color}">${n.emotion}</span><span class="sig">${n.signature} 写的</span><div style="margin-top:10px;line-height:1.9;white-space:pre-wrap">${escapeHtml(n.text)}</div><small style="color:#a18f99">${n.date}</small></article>`).join(''):'还没有星星信。'}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('enter').onclick=()=>{$('gift').classList.add('hide');document.body.addEventListener('click',()=>{}, {once:true})};
$('write').onclick=openCompose;$('x').onclick=closeCompose;$('cancel').onclick=closeCompose;$('fold').onclick=saveLetter;
document.querySelectorAll('.sign button').forEach(b=>b.onclick=()=>{signature=b.dataset.sig;document.querySelectorAll('.sign button').forEach(x=>x.classList.toggle('active',x===b))});
$('letters').onclick=()=>{$('saved').classList.add('open');renderNotes()};$('closeSaved').onclick=()=>$('saved').classList.remove('open');
$('shake').onclick=()=>{let a=stars();a.forEach(s=>{s.x=Math.max(8,Math.min(92,s.x+(Math.random()-.5)*22));s.y=Math.max(15,Math.min(90,s.y+(Math.random()-.5)*18));s.r+=Math.random()*90});saveStars(a);renderBottle();$('bottleWrap').animate([{transform:'rotate(0)'},{transform:'rotate(-3deg)'},{transform:'rotate(3deg)'},{transform:'rotate(0)'}],{duration:650})};
makeStars();setDate();renderBottle();setInterval(setDate,30000);
</script>
</body></html>
