<!doctype html>
<html lang="zh-CN">

<head>
<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Ink × Yyi · Our Star Bottle</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        "Noto Serif SC",
        "PingFang SC",
        serif;

    color:#fff;
    background:#080711;
}

button,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}


/* ================================
   WORLD
================================ */

#world{
    position:fixed;
    inset:0;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #2b2340,
            #09070e 70%
        );

    transition:
        background 1s ease;
}

#fx{
    position:absolute;
    inset:0;

    pointer-events:none;

    overflow:hidden;
}


/* ================================
   FULLSCREEN FX
================================ */

.p{
    position:absolute;
    pointer-events:none;
}

.rain{

    width:1px;
    height:75px;

    background:
        linear-gradient(
            transparent,
            #d8edff
        );

    opacity:.55;

    animation:
        rainFall linear infinite;
}

@keyframes rainFall{

    from{
        transform:
            translate3d(
                0,
                -100px,
                0
            )
            rotate(10deg);
    }

    to{
        transform:
            translate3d(
                -12vw,
                125vh,
                0
            )
            rotate(10deg);
    }

}


.ember{

    width:4px;
    height:18px;

    border-radius:50%;

    background:#ff6048;

    box-shadow:
        0 0 8px #ff6048,
        0 0 18px #ff3b2b;

    animation:
        emberUp linear infinite;
}

@keyframes emberUp{

    from{

        transform:
            translate3d(
                0,
                110vh,
                0
            );

        opacity:0;
    }

    15%{
        opacity:1;
    }

    to{

        transform:
            translate3d(
                -30px,
                -120vh,
                0
            );

        opacity:0;
    }

}


.spark{

    width:4px;
    height:4px;

    border-radius:50%;

    background:currentColor;

    box-shadow:
        0 0 15px currentColor;

    animation:
        sparkMove linear infinite;
}

@keyframes sparkMove{

    0%{

        transform:
            translate3d(
                0,
                20px,
                0
            )
            scale:.5;

        opacity:0;
    }

    30%{
        opacity:1;
    }

    55%{

        transform:
            translate3d(
                30px,
                -20px,
                0
            )
            scale:1.7;

    }

    100%{

        transform:
            translate3d(
                -15px,
                -110vh,
                0
            )
            scale:.2;

        opacity:0;
    }

}


.wave{

    width:18px;
    height:18px;

    border:
        1px solid currentColor;

    border-radius:50%;

    animation:
        waveExpand 4s ease-out infinite;
}

@keyframes waveExpand{

    from{

        opacity:.7;

        transform:
            translate(-50%,-50%)
            scale:.1;
    }

    to{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale:25;
    }

}


.wind{

    width:35vw;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            currentColor,
            transparent
        );

    box-shadow:
        0 0 8px currentColor;

    animation:
        windMove 1.2s linear infinite;
}

@keyframes windMove{

    from{
        transform:
            translateX(-100vw);
    }

    to{
        transform:
            translateX(180vw);
    }

}


.heart{

    font-size:18px;

    color:currentColor;

    text-shadow:
        0 0 12px currentColor,
        0 0 28px currentColor;

    animation:
        heartFloat linear infinite;
}

.heart::before{
    content:"♥";
}

@keyframes heartFloat{

    0%{

        transform:
            translate3d(
                0,
                20vh,
                0
            )
            scale(.7);

        opacity:0;
    }

    25%{
        opacity:1;
    }

    75%{

        transform:
            translate3d(
                35px,
                -50vh,
                0
            )
            scale(1.2);

    }

    100%{

        transform:
            translate3d(
                -20px,
                -110vh,
                0
            )
            scale(.6);

        opacity:0;
    }

}


/* ================================
   GATE
================================ */

#gate{

    position:fixed;
    inset:0;

    z-index:100;

    display:grid;

    place-items:center;

    background:
        radial-gradient(
            circle,
            #251d32,
            #09070e 75%
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#gate.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.intro{
    text-align:center;
}

.big{

    font-size:90px;

    color:#e8d17d;

    text-shadow:
        0 0 20px #e8d17d,
        0 0 45px #e8d17d66;

    animation:
        starBreath 4s ease-in-out infinite;
}

@keyframes starBreath{

    50%{
        transform:
            scale(1.08);

        opacity:.75;
    }

}

.intro h1{

    font-size:38px;

    font-weight:400;

    letter-spacing:8px;
}

.intro p{

    color:#aaa0b1;

    line-height:2;
}

.btn,
.enter{

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(215,197,140,.35);

    color:#eee5d9;

    border-radius:99px;

    padding:
        11px 20px;

    transition:.25s;
}

.btn:hover,
.enter:hover{

    background:
        rgba(255,255,255,.11);

    transform:
        translateY(-2px);

}


/* ================================
   MAIN
================================ */

main{

    position:relative;

    z-index:2;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;
}

.top{

    position:fixed;

    top:18px;

    left:22px;

    right:22px;

    display:flex;

    justify-content:space-between;

    font-size:10px;

    letter-spacing:3px;

    color:#a69aaa;
}


/* ================================
   BOTTLE
================================ */

.bottle{

    position:relative;

    width:
        min(440px,90vw);

    height:
        min(640px,72vh);

    filter:
        drop-shadow(
            0 35px 60px
            rgba(0,0,0,.75)
        );

    transform-origin:center;
}

#glass{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:3;

    pointer-events:none;
}


/* Matter 容器 */

#stars{

    position:absolute;

    left:16%;
    right:16%;

    top:25%;
    bottom:7%;

    overflow:hidden;

    border-radius:
        40% 40% 18% 18%;

    z-index:4;
}


/* ================================
   STAR
================================ */

.star{

    position:absolute;

    width:20px;
    height:20px;

    clip-path:
        polygon(
            50% 0,
            61% 35%,
            100% 35%,
            69% 57%,
            81% 100%,
            50% 73%,
            19% 100%,
            31% 57%,
            0 35%,
            39% 35%
        );

    background:
        var(--c);

    box-shadow:
        0 0 12px var(--c),
        0 0 30px var(--c),
        0 0 55px var(--c);

    cursor:pointer;

    will-change:
        transform,
        left,
        top;

    transform:
        translate(-50%,-50%);

}


/* 星星中心亮点 */

.star::after{

    content:"";

    position:absolute;

    width:5px;
    height:5px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#fff;

    opacity:.7;

    box-shadow:
        0 0 8px #fff;

}


/* ================================
   TRAIL
================================ */

.trail{

    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:
        var(--c);

    box-shadow:
        0 0 10px var(--c),
        0 0 18px var(--c);

    pointer-events:none;

    opacity:.7;

    transform:
        translate(-50%,-50%);

    animation:
        trailFade .6s ease-out forwards;
}

@keyframes trailFade{

    to{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.1);

    }

}


/* ================================
   STATS
================================ */

.stats{

    display:flex;

    gap:28px;

    color:#aaa0b0;

    font-size:12px;
}

.stats b{

    color:#e9d68d;

    font-size:18px;

    font-weight:400;
}


.actions{

    display:flex;

    gap:8px;

    margin-top:12px;

    flex-wrap:wrap;

    justify-content:center;
}


/* ================================
   PANELS
================================ */

.panel{

    position:fixed;

    inset:0;

    z-index:50;

    background:
        rgba(5,4,11,.92);

    backdrop-filter:
        blur(18px);

    display:none;

    align-items:center;

    justify-content:center;

    padding:16px;
}

.panel.open{
    display:flex;
}

.card{

    width:
        min(650px,95vw);

    max-height:92vh;

    overflow:auto;

    background:#f7eee2;

    color:#352b31;

    border-radius:28px;

    padding:24px;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.7);
}

.x{

    float:right;

    border:0;

    background:none;

    font-size:25px;

    color:#777;
}


/* ================================
   EMOTIONS
================================ */

.emotions{

    display:grid;

    grid-template-columns:
        repeat(6,1fr);

    gap:7px;
}

.emotion{

    border:
        1px solid #d2c4ba;

    background:#fff;

    border-radius:14px;

    padding:8px 2px;

    font-size:11px;

    color:#352b31;
}

.emotion.on{

    outline:
        2px solid var(--c);

    box-shadow:
        0 0 15px
        var(--c);
}

.dot{

    width:22px;
    height:22px;

    border-radius:50%;

    margin:
        auto auto 5px;

    background:
        var(--c);

    box-shadow:
        0 0 12px var(--c);
}


/* ================================
   TEXT
================================ */

textarea{

    width:100%;

    height:300px;

    margin-top:12px;

    border:0;

    outline:0;

    resize:none;

    background:
        repeating-linear-gradient(
            transparent 0 39px,
            #ded1c5 40px
        );

    font:
        17px/40px
        Georgia,
        "PingFang SC",
        serif;

    color:#352b31;
}

.sign{

    text-align:center;

    margin:10px;
}

.sign button{

    border:
        1px solid #c8bbb2;

    background:#fff;

    border-radius:99px;

    padding:
        8px 17px;

    margin:
        0 3px;
}

.sign .on{

    background:#3b2c38;

    color:#fff;
}

.row{
    text-align:center;
}

.primary{

    border:0;

    border-radius:99px;

    background:#3b2c38;

    color:#fff;

    padding:
        11px 22px;
}


/* ================================
   NOTES
================================ */

.note{

    padding:
        15px 0;

    border-bottom:
        1px solid #ded2c8;
}

.tag{

    display:inline-block;

    padding:
        4px 9px;

    border-radius:99px;

    color:#fff;

    font-size:11px;
}

.who{

    float:right;

    color:#88747e;
}

.note p{

    white-space:pre-wrap;

    line-height:1.8;
}

.note small{

    color:#9b8c92;
}


/* ================================
   STATUS
================================ */

.status{

    position:fixed;

    bottom:
        15px;

    right:16px;

    z-index:20;

    font-size:10px;

    color:#a69aaa;

    letter-spacing:1px;
}


/* ================================
   MOBILE
================================ */

@media(max-width:520px){

    .emotions{

        grid-template-columns:
            repeat(3,1fr);
    }

    .intro h1{

        font-size:31px;
    }

    .bottle{

        width:94vw;

        height:68vh;
    }

}

</style>
</head>


<body>

</div>

        </div>

     WRITE

<script>

/* =========================================================
   SUPABASE
========================================================= */

const URL =
    "https://fgerhmqwqflgggnqpuas.supabase.co";

const KEY =
    "sb_publishable_qkiY07ycZktk7tzeEfjT2g_C6hjmpSi";

const ROOM =
    "ink-yyi";

const db =
    supabase.createClient(
        URL,
        KEY
    );


/* =========================================================
   DATA
========================================================= */

const E = [

    ["开心","#f4d24f","happy"],

    ["难过","#78a9df","sad"],

    ["生气","#ef5a4f","angry"],

    ["平静","#79c8b1","calm"],

    ["焦虑","#b58bd8","anxious"],

    ["想念","#8c78e8","miss"]

];


let ei = 0;

let who = "Ink";

let letters = [];

let stars = [];


/* =========================================================
   DOM
========================================================= */

const $ =
    id =>
        document.getElementById(id);


/* =========================================================
   SAFE HTML
========================================================= */

function esc(value){

    return String(value ?? "")
        .replace(
            /[&<>"]/g,
            m => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;"
            })[m]
        );

}


/* =========================================================
   STATUS
========================================================= */

function status(text){

    $("status").textContent =
        text;

}


/* =========================================================
   SUPABASE CLOUD
========================================================= */

let realtimeChannel = null;

async function cloud(){

    status(
        "● 云端连接中"
    );


    const result =
        await db
            .from("star_letters")
            .select("*")
            .eq("room",ROOM)
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    if(result.error){

        console.error(
            result.error
        );

        status(
            "● 云端连接失败"
        );

        return;

    }


    letters =
        result.data || [];


    render();


    /*
     * 防止重复建立 realtime channel。
     */

    if(realtimeChannel){

        try{

            await db.removeChannel(
                realtimeChannel
            );

        }catch(e){}

    }


    realtimeChannel =
        db
            .channel(
                "star-bottle-" + ROOM
            )
            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"star_letters",
                    filter:
                        "room=eq." + ROOM
                },
                payload => {

                    const incoming =
                        payload.new;


                    if(
                        !letters.some(
                            x =>
                                String(x.id) ===
                                String(incoming.id)
                        )
                    ){

                        letters.push(
                            incoming
                        );


                        render();

                    }

                }
            )
            .subscribe(
                state => {

                    if(
                        state ===
                        "SUBSCRIBED"
                    ){

                        status(
                            "● 已连接 · 两个人共享同一瓶"
                        );

                    }

                }
            );

}


/* =========================================================
   RENDER ALL
========================================================= */

function render(){

    $("ic").textContent =
        letters.filter(
            x =>
                x.who === "Ink"
        ).length;


    $("yc").textContent =
        letters.filter(
            x =>
                x.who === "Yyi"
        ).length;


    $("tc").textContent =
        letters.length;


    rebuildStars();

}


/* =========================================================
   SHOW LETTER
========================================================= */

function show(note){

    $("box")
        .classList
        .add("open");


    $("notes").innerHTML = `

        <article class="note">

            <span
                class="tag"
                style="background:${esc(
                    note.color
                )}"
            >
                ${esc(
                    note.emotion
                )}
            </span>


            <span class="who">

                ${esc(
                    note.who
                )}

                写的

            </span>


            <p>
                ${esc(
                    note.text
                )}
            </p>


            <small>

                ${
                    note.created_at
                    ? new Date(
                        note.created_at
                    ).toLocaleString(
                        "zh-CN"
                    )
                    : ""

                }

            </small>

        </article>

    `;

}


/* =========================================================
   ARCHIVE
========================================================= */

function archive(){

    $("box")
        .classList
        .add("open");


    if(!letters.length){

        $("notes").innerHTML =
            "<p>还没有星星信。</p>";

        return;

    }


    $("notes").innerHTML =
        letters
            .slice()
            .reverse()
            .map(
                note => `

                    <article class="note">

                        <span
                            class="tag"
                            style="background:${esc(
                                note.color
                            )}"
                        >
                            ${esc(
                                note.emotion
                            )}
                        </span>


                        <span class="who">

/* =========================================================
   AUDIO
========================================================= */

let audioMaster = null;


function stopAudio(){

    if(audioMaster){

        try{

            audioMaster.close();

        }catch(e){}

        audioMaster =
            null;

    }

}


function createNoise(
    ctx,
    seconds
){

    const buffer =
        ctx.createBuffer(
            1,
            Math.floor(
                ctx.sampleRate *
                seconds
            ),
            ctx.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    for(
        let i=0;
        i<data.length;
        i++
    ){

        data[i] =
            Math.random()*2-1;

    }


    return buffer;

}


function sound(key){

    stopAudio();


    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AudioContext){

            return;

        }


        const ctx =
            new AudioContext();


        audioMaster =
            ctx;


        const master =
            ctx.createGain();


        master.gain.value =
            .11;


        master.connect(
            ctx.destination
        );


        const profiles = {

            happy:{
                tones:[
                    523.25,
                    659.25,
                    783.99
                ],
                type:"sine"
            },

            sad:{
                tones:[
                    196,
                    246.94,
                    293.66
                ],
                type:"sine"
            },

            angry:{
                tones:[
                    73.42,
                    92.5,
                    110
                ],
                type:"sawtooth"
            },

            calm:{
                tones:[
                    174.61,
                    220,
                    261.63
                ],
                type:"sine"
            },

            anxious:{
                tones:[
                    146.83,
                    220,
                    329.63
                ],
                type:"triangle"
            },

            miss:{
                tones:[
                    261.63,
                    329.63,
                    392
                ],
                type:"sine"
            }

        };


        const profile =
            profiles[key] ||
            profiles.calm;


        profile.tones.forEach(
            (frequency,index) => {

                const oscillator =
                    ctx.createOscillator();


                const gain =
                    ctx.createGain();


                oscillator.type =
                    profile.type;


                oscillator.frequency.value =
                    frequency;


                gain.gain.value =
                    .025;


                oscillator
                    .connect(gain)
                    .connect(master);


                oscillator.start();

            }
        );


        /*
         * 难过：
         * 雨声 + 白噪音。
         */

        if(
            key === "sad"
        ){

            const noise =
                ctx.createBufferSource();


            const gain =
                ctx.createGain();


            const filter =
                ctx.createBiquadFilter();


            noise.buffer =
                createNoise(
                    ctx,
                    2
                );


            noise.loop =
                true;


            filter.type =
                "lowpass";


            filter.frequency.value =
                2400;


            gain.gain.value =
                .09;


            noise
                .connect(filter)
                .connect(gain)
                .connect(master);


            noise.start();

        }


        /*
         * 开心/想念：
         * 轻微空气噪声。
         */

        if(
            key === "happy" ||
            key === "miss"
        ){

            const noise =
                ctx.createBufferSource();


            const gain =
                ctx.createGain();


            const filter =
                ctx.createBiquadFilter();


            noise.buffer =
                createNoise(
                    ctx,
                    1
                );


            noise.loop =
                true;


            filter.type =
                "highpass";


            filter.frequency.value =
                key === "happy"
                ? 1800
                : 900;


            gain.gain.value =
                .025;


            noise
                .connect(filter)
                .connect(gain)
                .connect(master);


            noise.start();

        }


        ctx.resume();

    }catch(error){

        console.warn(
            "Audio error:",
            error
        );

    }

}

/* =========================================================
   MATTER PHYSICS
========================================================= */

let engine = null;

let runner = null;

let bodies = [];

let physicsStarted = false;


/* =========================================================
   INIT PHYSICS
========================================================= */

function initPhysics(){

    /*
     * 如果已经存在物理世界，
     * 不重复创建。
     */

    if(
        engine
    ){

        return;

    }


    const {
        Engine,
        World,
        Bodies,
        Runner
    } = Matter;


    engine =
        Engine.create({
            enableSleeping:false
        });


    engine.gravity.y =
        .38;


    const container =
        $("stars");


    const width =
        container.clientWidth;


    const height =
        container.clientHeight;


    const wall =
        18;


    const common = {

        isStatic:true,

        restitution:.82,

        friction:.05

    };


    bodies = [

        Bodies.rectangle(
            width/2,
            -wall/2,
            width,
            wall,
            common
        ),

        Bodies.rectangle(
            width/2,
            height+wall/2,
            width,
            wall,
            common
        ),

        Bodies.rectangle(
            -wall/2,
            height/2,
            wall,
            height,
            common
        ),

        Bodies.rectangle(
            width+wall/2,
            height/2,
            wall,
            height,
            common
        )

    ];


    World.add(
        engine,
        bodies
    );


    runner =
        Runner.create();


    Runner.run(
        runner,
        engine
    );


    physicsStarted =
        true;


    rebuildMatter();

}


/* =========================================================
   REBUILD MATTER
========================================================= */

function rebuildMatter(){

    if(
        !engine
    ){

        return;

    }


    const {
        World,
        Bodies,
        Body
    } = Matter;


    const container =
        $("stars");


    const width =
        container.clientWidth;


    const height =
        container.clientHeight;


    /*
     * 只删除动态星星。
     * 四面墙保留。
     */

    const staticBodies =
        bodies.filter(
            b =>
                b.isStatic
        );


    const dynamicBodies =
        bodies.filter(
            b =>
                !b.isStatic
        );


    dynamicBodies.forEach(
        body => {

            World.remove(
                engine.world,
                body
            );

        }
    );


    bodies =
        staticBodies;


    /*
     * 为每封信建立一个 body。
     */

    stars.forEach(
        star => {

            let x =
                (star.x/100) *
                width;


            let y =
                (star.y/100) *
                height;


            const radius =
                10;


            x =
                Math.max(
                    radius,
                    Math.min(
                        width-radius,
                        x
                    )
                );


            y =
                Math.max(
                    radius,
                    Math.min(
                        height-radius,
                        y
                    )
                );


            const body =
                Bodies.circle(
                    x,
                    y,
                    radius,
                    {

                        restitution:.88,

                        friction:.015,

                        frictionAir:.006,

                        density:.006,

                        slop:.01

                    }
                );


            body.starId =
                star.id;


            body.color =
                star.color;


            /*
             * 轻微初速度。
             */

            Body.setVelocity(
                body,
                {
                    x:
                        (Math.random()-.5) *
                        .7,

                    y:
                        (Math.random()-.5) *
                        .4
                }
            );


            bodies.push(
                body
            );


            World.add(
                engine.world,
                body
            );

        }
    );

}


/* =========================================================
   SYNC MATTER -> DOM
========================================================= */

let syncFrame = null;


function syncMatterStars(){

    if(
        !engine
    ){

        return;

    }


    const container =
        $("stars");


    const width =
        container.clientWidth;


    const height =
        container.clientHeight;


    const dynamic =
        bodies.filter(
            b =>
                !b.isStatic
        );


    /*
     * 根据 starId 找 DOM。
     * 不再依赖数组顺序。
     */

    const domMap =
        new Map();


    container
        .querySelectorAll(".star")
        .forEach(
            element => {

                domMap.set(
                    String(
                        element.dataset.id
                    ),
                    element
                );

            }
        );


    dynamic.forEach(
        body => {

            const element =
                domMap.get(
                    String(
                        body.starId
                    )
                );


            if(!element){

                return;

            }


            const x =
                body.position.x /
                width *
                100;


            const y =
                body.position.y /
                height *
                100;


            element.style.left =
                x + "%";


            element.style.top =
                y + "%";


            element.style.transform =
                `
                    translate(-50%,-50%)
                    rotate(${body.angle}rad)
                `;


            /*
             * 速度足够快才产生拖尾。
             */

            const speed =
                Math.hypot(
                    body.velocity.x,
                    body.velocity.y
                );


            if(
                speed > .45 &&
                Math.random() < .18
            ){

                createTrail(
                    x,
                    y,
                    body.color
                );

            }

        }
    );


    syncFrame =
        requestAnimationFrame(
            syncMatterStars
        );

}

function shake(power=1){

    if(
        !engine ||
        shaking
    ){

        return;

    }


    shaking =
        true;


    const {
        Body
    } = Matter;


    const dynamic =
        bodies.filter(
            b =>
                !b.isStatic
        );


    dynamic.forEach(
        body => {

            Body.applyForce(
                body,
                body.position,
                {

                    x:
                        (
                            Math.random()-.5
                        ) *
                        .055 *
                        power,

                    y:
                        -(
                            .035 +
                            Math.random()*.045
                        ) *
                        power

                }
            );


            Body.setAngularVelocity(
                body,
                (
                    Math.random()-.5
                ) *
                .35 *
                power
            );

        }
    );


    /*
     * 瓶子本身摇晃。
     */

    $("bottle").animate(

        [

            {
                transform:
                    "translateX(0) rotate(0deg)"
            },

            {
                transform:
                    "translateX(-16px) rotate(-4deg)"
            },

            {
                transform:
                    "translateX(17px) rotate(4deg)"
            },

            {
                transform:
                    "translateX(-11px) rotate(-3deg)"
            },

            {
                transform:
                    "translateX(7px) rotate(2deg)"
            },

            {
                transform:
                    "translateX(0) rotate(0deg)"
            }

        ],

        {

            duration:950,

            easing:
                "cubic-bezier(.2,.8,.2,1)"

        }

    );


    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            [45,30,70]
        );

    }


    setTimeout(
        () => {

            shaking =
                false;

        },
        950
    );

}


/* =========================================================
   REBUILD STARS
========================================================= */

function rebuildStars(){

    /*
     * 保存旧位置。
     */

    const old =
        new Map(
            stars.map(
                star =>
                    [
                        String(star.id),
                        star
                    ]
            )
        );


    stars =
        letters.map(
            note => {

                const previous =
                    old.get(
                        String(note.id)

}

/* =========================================================
   DEVICE SHAKE
========================================================= */

let lastShakeCheck =
    0;

let lastAcc = {

    x:0,
    y:0,
    z:0

};


window.addEventListener(
    "devicemotion",
    event => {

        const acc =
            event.accelerationIncludingGravity;


        if(!acc){

            return;

        }


        const now =
            Date.now();


        if(
            now -
            lastShakeCheck <
            150
        ){

            return;

        }


        lastShakeCheck =
            now;


        const dx =
            Math.abs(
                (acc.x || 0) -
                lastAcc.x
            );


        const dy =
            Math.abs(
                (acc.y || 0) -
                lastAcc.y
            );


        const dz =
            Math.abs(
                (acc.z || 0) -
                lastAcc.z
            );


        lastAcc.x =
            acc.x || 0;

        lastAcc.y =
            acc.y || 0;

        lastAcc.z =
            acc.z || 0;


        if(
            dx +
            dy +
            dz >
            30
        ){

            shake(.8);

        }

    }
);

    new Date()
        .toLocaleDateString(
            "zh-CN",
            {
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );

</script>
