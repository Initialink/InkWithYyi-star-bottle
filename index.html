<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ink × Yyi · Our Star Bottle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:"Noto Serif SC","PingFang SC",serif;color:#fff;background:#080711}button,textarea{font:inherit}button{cursor:pointer}
#world{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle,#2b2340,#09070e 70%);transition:1s}#fx{position:absolute;inset:0;pointer-events:none}
.p{position:absolute;border-radius:50%}.rain{width:1px;height:70px;background:linear-gradient(transparent,#d8edff);opacity:.5;animation:rain linear infinite}@keyframes rain{to{transform:translate(-12vw,125vh)}}.ember{width:4px;height:18px;background:#ff6048;box-shadow:0 0 18px #ff3b2b;animation:up linear infinite}@keyframes up{to{transform:translate(-20px,-120vh);opacity:0}}.spark{width:4px;height:4px;background:currentColor;box-shadow:0 0 15px currentColor;animation:sp linear infinite}@keyframes sp{50%{transform:translate(30px,-20px) scale(1.7)}to{transform:translate(-15px,-110vh);opacity:0}}.wave{border:1px solid currentColor;width:18px;height:18px;animation:wa 4s ease-out infinite}@keyframes wa{to{width:70vw;height:70vw;opacity:0;transform:translate(-50%,-50%)}}.wind{width:35vw;height:1px;background:currentColor;animation:wi 1.2s linear infinite}@keyframes wi{from{transform:translateX(-100vw)}to{transform:translateX(180vw)}}
#gate{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:#09070e;transition:.8s}.hide{opacity:0;pointer-events:none}.intro{text-align:center}.big{font-size:90px;text-shadow:0 0 35px #e8d17d}.intro h1{font-size:38px;font-weight:400;letter-spacing:8px}.intro p{color:#aaa0b1;line-height:2}.btn,.enter{background:#ffffff0b;border:1px solid #d7c58c55;color:#eee5d9;border-radius:99px;padding:11px 20px}
main{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column}.top{position:fixed;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:3px;color:#a69aaa}
.bottle{position:relative;width:min(440px,90vw);height:min(640px,72vh);filter:drop-shadow(0 35px 60px #000b)}#glass{position:absolute;width:100%;height:100%}#stars{position:absolute;left:16%;right:16%;top:25%;bottom:7%;overflow:hidden;border-radius:40% 40% 18% 18%}.star{position:absolute;width:20px;height:20px;clip-path:polygon(50% 0,61% 35%,100% 35%,69% 57%,81% 100%,50% 73%,19% 100%,31% 57%,0 35%,39% 35%);background:var(--c);box-shadow:0 0 12px var(--c),0 0 30px var(--c);cursor:pointer}.trail{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);opacity:.6;animation:tr .55s forwards}@keyframes tr{to{opacity:0;transform:scale(.1)}}
.stats{display:flex;gap:28px;color:#aaa0b0;font-size:12px}.stats b{color:#e9d68d;font-size:18px;font-weight:400}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.panel{position:fixed;inset:0;z-index:8;background:#05040bea;backdrop-filter:blur(18px);display:none;align-items:center;justify-content:center;padding:16px}.open{display:flex}.card{width:min(650px,95vw);max-height:92vh;overflow:auto;background:#f7eee2;color:#352b31;border-radius:28px;padding:24px}.x{float:right;border:0;background:none;font-size:25px;color:#777}.emotions{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.emotion{border:1px solid #d2c4ba;background:#fff;border-radius:14px;padding:8px 2px;font-size:11px}.emotion.on{outline:2px solid var(--c)}.dot{width:22px;height:22px;border-radius:50%;margin:auto auto 5px;background:var(--c);box-shadow:0 0 12px var(--c)}textarea{width:100%;height:300px;margin-top:12px;border:0;outline:0;resize:none;background:repeating-linear-gradient(transparent 0 39px,#ded1c5 40px);font:17px/40px Georgia,"PingFang SC",serif;color:#352b31}.sign{text-align:center;margin:10px}.sign button{border:1px solid #c8bbb2;background:#fff;border-radius:99px;padding:8px 17px}.sign .on{background:#3b2c38;color:#fff}.row{text-align:center}.primary{border:0;border-radius:99px;background:#3b2c38;color:#fff;padding:11px 22px}.note{padding:15px 0;border-bottom:1px solid #ded2c8}.tag{padding:4px 9px;border-radius:99px;color:#fff;font-size:11px}.who{float:right;color:#88747e}.note p{white-space:pre-wrap;line-height:1.8}.status{position:fixed;bottom:15px;right:16px;font-size:10px;color:#a69aaa}
@media(max-width:520px){.emotions{grid-template-columns:repeat(3,1fr)}.intro h1{font-size:31px}}
</style></head><body>
<div id="world"><div id="fx"></div></div><section id="gate"><div class="intro"><div class="big">✦</div><h1>Ink × Yyi</h1><p>我们的星星瓶<br>把想说的话，折成星星。</p><button class="enter" id="enter">打开我们的星星瓶 ✦</button></div></section>
<main><div class="top"><span id="date"></span><span>OUR STAR BOTTLE</span></div><div class="bottle" id="bottle">
<svg id="glass" viewBox="0 0 440 640"><defs><linearGradient id="g"><stop stop-color="#fff" stop-opacity=".24"/><stop offset=".45" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#9b7ad0" stop-opacity=".18"/></linearGradient><linearGradient id="gold" x2="0" y2="1"><stop stop-color="#e7d19b"/><stop offset="1" stop-color="#725938"/></linearGradient></defs><path d="M158 55h124v78c0 18 48 32 64 65 9 19 13 43 13 73v278c0 48-27 72-75 72H156c-48 0-75-24-75-72V271c0-30 4-54 13-73 16-33 64-47 64-65V55z" fill="url(#g)" stroke="#eee6ff44" stroke-width="3"/><path d="M168 55h104v86c0 18 39 33 54 62 8 16 11 38 11 67v277c0 35-19 53-57 53H160c-38 0-57-18-57-53V270c0-29 3-51 11-67 15-29 54-44 54-62V55z" fill="none" stroke="#fff3" stroke-width="10"/><rect x="149" y="31" width="142" height="30" rx="9" fill="url(#gold)"/><rect x="161" y="21" width="118" height="14" rx="5" fill="#6d5436"/><path d="M112 243c16-44 46-59 66-80M329 279c8 52 8 116 7 181" fill="none" stroke="#fff5" stroke-width="7" stroke-linecap="round"/></svg><div id="stars"></div></div>
<div class="stats"><span>Ink <b id="ic">0</b> ✦</span><span>Yyi <b id="yc">0</b> ✦</span><span>总计 <b id="tc">0</b></span></div><div class="actions"><button class="btn" id="write">写一封星星信 ✦</button><button class="btn" id="archive">星星档案</button><button class="btn" id="shake">摇一摇 ✦</button></div></main>
<section class="panel" id="compose"><div class="card"><button class="x" id="close">×</button><h2>把一句话，留下来</h2><div class="emotions" id="emotions"></div><textarea id="text" maxlength="5000" placeholder="写下现在想留下的话……"></textarea><div class="sign"><button class="on" data-who="Ink">Ink 写的</button><button data-who="Yyi">Yyi 写的</button></div><div class="row"><button class="primary" id="fold">折成星星 ✦</button></div></div></section>
<section class="panel" id="box"><div class="card"><button class="x" id="closeBox">×</button><h2>星星档案</h2><div id="notes"></div></div></section><div class="status" id="status">● 云端连接中</div>
<script>
const URL="https://fgerhmqwqflgggnqpuas.supabase.co",KEY="sb_publishable_qkiY07ycZktk7tzeEfjT2g_C6hjmpSi",ROOM="ink-yyi",db=supabase.createClient(URL,KEY);
const E=[["开心","#f4d24f","happy"],["难过","#78a9df","sad"],["生气","#ef5a4f","angry"],["平静","#79c8b1","calm"],["焦虑","#b58bd8","anxious"],["想念","#8c78e8","miss"]];let ei=0,who="Ink",letters=[],stars=[],last=0,ac=null,lock=0,$=x=>document.getElementById(x);
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function status(s){$("status").textContent=s}
async function cloud(){let r=await db.from("star_letters").select("*").eq("room",ROOM).order("created_at");if(r.error){status("● 云端连接失败");return}letters=r.data||[];render();db.channel("star-bottle").on("postgres_changes",{event:"INSERT",schema:"public",table:"star_letters",filter:"room=eq."+ROOM},p=>{if(!letters.some(x=>x.id===p.new.id)){letters.push(p.new);render()}}).subscribe(s=>status(s==="SUBSCRIBED"?"● 已连接 · 两个人共享同一瓶":"● 云端连接中"))}
function render(){
  rebuildStars();
  $("ic").textContent=letters.filter(x=>x.who==="Ink").length;
  $("yc").textContent=letters.filter(x=>x.who==="Yyi").length;
  $("tc").textContent=letters.length;
}
function show(n){$("box").classList.add("open");$("notes").innerHTML=`<article class="note"><span class="tag" style="background:${n.color}">${esc(n.emotion)}</span><span class="who">${esc(n.who)} 写的</span><p>${esc(n.text)}</p><small>${new Date(n.created_at).toLocaleString("zh-CN")}</small></article>`}
function archive(){$("box").classList.add("open");$("notes").innerHTML=letters.length?letters.slice().reverse().map(n=>`<article class="note"><span class="tag" style="background:${n.color}">${esc(n.emotion)}</span><span class="who">${esc(n.who)} 写的</span><p>${esc(n.text)}</p><small>${new Date(n.created_at).toLocaleString("zh-CN")}</small></article>`).join(""):"还没有星星信。"}
function emo(){ $("emotions").innerHTML=E.map((e,i)=>`<button class="emotion ${i===ei?"on":""}" style="--c:${e[1]}" data-i="${i}"><div class="dot"></div>${e[0]}</button>`).join("");document.querySelectorAll(".emotion").forEach(b=>b.onclick=()=>{ei=+b.dataset.i;emo();fx()})}
function stop(){ $("fx").innerHTML="";$("world").style.background="radial-gradient(circle,#2b2340,#09070e 70%)";if(ac)try{ac.close()}catch(e){}ac=null}
function fx(){stop();let [n,c,k]=E[ei];$("world").style.background={happy:"radial-gradient(circle,#66521d,#0d0a08 68%)",sad:"radial-gradient(circle,#315b82,#07131d 68%)",angry:"radial-gradient(circle at 50% 90%,#7c251b,#100407 68%)",calm:"radial-gradient(circle,#27736b,#06181b 68%)",anxious:"radial-gradient(circle,#5d377e,#10091b 68%)",miss:"radial-gradient(circle,#514791,#100c24 68%)"}[k];let cl=k==="sad"?"rain":k==="angry"?"ember":k==="calm"?"wave":k==="anxious"?"wind":"spark";for(let i=0;i<(cl==="rain"?200:cl==="wave"?10:90);i++){let p=document.createElement("i");p.className="p "+cl;p.style.left=Math.random()*100+"%";p.style.top=Math.random()*100+"%";p.style.color=c;p.style.animationDuration=(cl==="rain"?(.35+Math.random()*.55):(2+Math.random()*4))+"s";p.style.animationDelay=-Math.random()*5+"s";$("fx").appendChild(p)}sound(k)}
let audioMaster=null, audioNodes=[];
function sound(k){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    if(audioMaster){try{audioMaster.close()}catch(e){}}
    audioMaster=new C();
    const ctx=audioMaster, master=ctx.createGain();
    master.gain.value=.12; master.connect(ctx.destination); audioNodes=[master];

    // Every emotion gets an audible soundscape. Sadness additionally gets rain/white noise.
    const profiles={
      happy:{tones:[523.25,659.25,783.99],type:"sine",speed:1.6},
      sad:{tones:[196,246.94,293.66],type:"sine",speed:3.2},
      angry:{tones:[73.42,92.5,110],type:"sawtooth",speed:.55},
      calm:{tones:[174.61,220,261.63],type:"sine",speed:5.5},
      anxious:{tones:[146.83,220,329.63],type:"triangle",speed:1.05},
      miss:{tones:[261.63,329.63,392],type:"sine",speed:2.6}
    };
    const p=profiles[k]||profiles.calm;
    p.tones.forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(), l=ctx.createOscillator(), lg=ctx.createGain();
      o.type=p.type;o.frequency.value=f;
      l.frequency.value=p.speed*(.15+i*.07); lg.gain.value=.018;
      l.connect(lg).connect(g.gain); g.gain.value=.035;
      o.connect(g).connect(master); o.start(); l.start();
      audioNodes.push(o,g,l,lg);
    });
    if(k==="sad"){
      const buffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate), d=buffer.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
      const n=ctx.createBufferSource(), ng=ctx.createGain(), lp=ctx.createBiquadFilter();
      n.buffer=buffer;n.loop=true;lp.type="lowpass";lp.frequency.value=2400;ng.gain.value=.085;
      n.connect(lp).connect(ng).connect(master);n.start();audioNodes.push(n,ng,lp);
    }
    if(k==="happy"||k==="miss"){
      const noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),d=noise.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.08;
      const n=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();
      n.buffer=noise;n.loop=true;f.type="highpass";f.frequency.value=k==="happy"?1800:900;g.gain.value=.035;
      n.connect(f).connect(g).connect(master);n.start();audioNodes.push(n,g,f);
    }
  }catch(e){console.warn("audio",e)}
}
function stop(){
  $("fx").innerHTML="";
  $("world").style.background="radial-gradient(circle,#2b2340,#09070e 70%)";
  if(audioMaster){try{audioMaster.close()}catch(e){}audioMaster=null}
}
async function fold(){let t=$("text").value.trim();if(!t)return;let e=E[ei],r=await db.from("star_letters").insert({room:ROOM,text:t,emotion:e[0],color:e[1],who}).select().single();if(r.error){status("● 保存失败");return}if(r.data&&!letters.some(x=>x.id===r.data.id))letters.push(r.data);$("text").value="";closeWrite();render()}
function openWrite(){$("compose").classList.add("open");emo();fx();$("text").focus()}function closeWrite(){$("compose").classList.remove("open");stop()}
let engine=null, bodies=[], runnerStarted=false;
function initPhysics(){
  const {Engine,World,Bodies,Body}=Matter;
  engine=Engine.create({enableSleeping:false});
  engine.gravity.y=.38;
  const container=$("stars"), w=container.clientWidth, h=container.clientHeight;
  const wall=14, common={isStatic:true,restitution:.9,friction:.05};
  bodies=[
    Bodies.rectangle(w/2,-wall/2,w,wall,common),
    Bodies.rectangle(w/2,h+wall/2,w,wall,common),
    Bodies.rectangle(-wall/2,h/2,wall,h,common),
    Bodies.rectangle(w+wall/2,h/2,wall,h,common)
  ];
  World.add(engine,bodies);
  if(!runnerStarted){Matter.Runner.run(Matter.Runner.create(),engine);runnerStarted=true}
}
function rebuildMatter(){
  if(!engine)return;
  const {World,Bodies,Body}=Matter, container=$("stars"), w=container.clientWidth,h=container.clientHeight;
  bodies.filter(b=>!b.isStatic).forEach(b=>World.remove(engine.world,b));
  bodies=bodies.filter(b=>b.isStatic);
  stars.forEach((s,i)=>{
    const x=(s.x/100)*w,y=(s.y/100)*h;
    const b=Bodies.circle(x,y,10,{restitution:.88,friction:.015,frictionAir:.003,density:.006});
    b.starId=s.id; b.color=s.color; Body.setVelocity(b,{x:(Math.random()-.5)*1.2,y:(Math.random()-.5)*.8});
    bodies.push(b);World.add(engine.world,b);
  });
}
function syncMatterStars(){
  if(!engine)return;
  const dynamic=bodies.filter(b=>!b.isStatic);
  const es=[...$("stars").children];
  dynamic.forEach((b,i)=>{
    const el=es[i];if(!el)return;
    const c=$("stars"), x=b.position.x/c.clientWidth*100,y=b.position.y/c.clientHeight*100;
    el.style.left=x+"%";el.style.top=y+"%";
    el.style.transform=`translate(-50%,-50%) rotate(${b.angle}rad)`;
    if(Math.random()<.22){
      const q=document.createElement("i");q.className="trail";q.style.setProperty("--c",b.color);
      q.style.left=x+"%";q.style.top=y+"%";c.appendChild(q);setTimeout(()=>q.remove(),550);
    }
  });
  requestAnimationFrame(syncMatterStars);
}
function shake(p=1){
  if(!engine)return;
  const {Body}=Matter;
  const dynamic=bodies.filter(b=>!b.isStatic);
  dynamic.forEach(b=>{
    Body.applyForce(b,b.position,{x:(Math.random()-.5)*.035*p,y:-(.025+Math.random()*.035)*p});
    Body.setAngularVelocity(b,(Math.random()-.5)*.18*p);
  });
  $("bottle").animate([
    {transform:"translateX(0) rotate(0deg)"},
    {transform:"translateX(-12px) rotate(-4deg)"},
    {transform:"translateX(14px) rotate(4deg)"},
    {transform:"translateX(-7px) rotate(-2deg)"},
    {transform:"translateX(0) rotate(0deg)"}
  ],{duration:900,easing:"cubic-bezier(.2,.8,.2,1)"});
  if(navigator.vibrate)navigator.vibrate([45,30,70]);
}
function rebuildStars(){
  const old=new Map(stars.map(s=>[String(s.id),s]));
  stars=letters.map(n=>old.get(String(n.id))||{
    id:n.id,color:n.color,x:40+Math.random()*25,y:68+Math.random()*20
  });
  const layer=$("stars");layer.innerHTML="";
  letters.forEach(n=>{
    const el=document.createElement("i");el.className="star";el.style.setProperty("--c",n.color);
    el.dataset.id=n.id;el.title=n.emotion+" · "+n.who;el.onclick=()=>show(n);layer.appendChild(el);
  });
  if(engine)rebuildMatter();
}
function physicsFrame(){
  syncMatterStars();
}
$("enter").onclick=()=>{$("gate").classList.add("hide");initPhysics();cloud();requestAnimationFrame(syncMatterStars)};$("write").onclick=openWrite;$("close").onclick=closeWrite;$("fold").onclick=fold;$("archive").onclick=archive;$("closeBox").onclick=()=>$("box").classList.remove("open");$("shake").onclick=()=>shake();document.querySelectorAll(".sign button").forEach(b=>b.onclick=()=>{who=b.dataset.who;document.querySelectorAll(".sign button").forEach(x=>x.classList.toggle("on",x===b))});window.addEventListener("resize",()=>{if(engine){initPhysics();rebuildMatter()}});window.addEventListener("devicemotion",e=>{let a=e.accelerationIncludingGravity;if(a&&Math.hypot(a.x||0,a.y||0,a.z||0)>23)shake(.7)});$("date").textContent=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric"});
</script></body></html>
