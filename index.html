<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0810">
  <title>只属于我们的星河 ✦ Ink × Yyi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ===== 样式与之前相同，为保证完整，此处保留全部原有样式（已整合） ===== */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; overflow:hidden; font-family:"Noto Serif SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",serif; background:#0b0810; color:#f0ebe3; -webkit-user-select:none; user-select:none; }
    textarea { -webkit-user-select:text; user-select:text; }
    /* ===== 开场 ===== */
    #intro { position:fixed; inset:0; z-index:300; background:#0b0810; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 1.2s ease; }
    #intro.hidden { opacity:0; pointer-events:none; }
    .intro-star { width:12px; height:12px; background:#f5e6d3; border-radius:50%; box-shadow:0 0 40px #f5e6d3; animation:introPulse 2.6s ease-in-out infinite; }
    @keyframes introPulse { 0%,100%{opacity:0.2;transform:scale(0.6);} 50%{opacity:1;transform:scale(1.2);} }
    .intro-title { margin-top:32px; font-size:28px; letter-spacing:6px; font-weight:700; color:#f5e6d3; opacity:0; animation:fadeUp 1s ease 0.6s forwards; }
    .intro-sub { font-size:14px; letter-spacing:4px; color:#b8a08c; margin-top:12px; opacity:0; animation:fadeUp 1s ease 1s forwards; }
    .intro-quote { font-size:14px; color:#8a7a6a; margin-top:18px; letter-spacing:2px; opacity:0; animation:fadeUp 1s ease 1.4s forwards; }
    .intro-btn { margin-top:36px; padding:14px 40px; border-radius:60px; border:1.5px solid rgba(245,230,211,0.3); background:transparent; color:#f5e6d3; font-family:inherit; font-size:16px; letter-spacing:4px; cursor:pointer; transition:all 0.4s; opacity:0; animation:fadeUp 1s ease 1.8s forwards; position:relative; overflow:hidden; }
    .intro-btn:hover { background:rgba(245,230,211,0.08); border-color:#d4a574; box-shadow:0 0 40px rgba(212,165,116,0.15); }
    @keyframes fadeUp { 0%{opacity:0;transform:translateY(18px);} 100%{opacity:1;transform:translateY(0);} }
    /* ===== 主场景 ===== */
    #app { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; transition:opacity 1.2s ease; }
    #app.ready { opacity:1; }
    .galaxy-bg { position:absolute; inset:0; z-index:0; background:radial-gradient(ellipse 70% 50% at 50% 60%, #1c1428 0%, #0b0810 70%); overflow:hidden; }
    .galaxy-bg::after { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 60% 30% at 30% 40%, rgba(140,100,180,0.06), transparent 60%), radial-gradient(ellipse 40% 50% at 80% 70%, rgba(80,120,200,0.04), transparent 50%); pointer-events:none; }
    .nebula { position:absolute; border-radius:50%; filter:blur(80px); opacity:0.2; animation:nebulaDrift 60s ease-in-out infinite alternate; }
    .nebula.n1 { width:500px; height:300px; top:10%; left:-10%; background:#5a3a7a; }
    .nebula.n2 { width:400px; height:400px; bottom:-10%; right:-10%; background:#2a4a6a; animation-delay:-30s; }
    @keyframes nebulaDrift { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(30px,20px) scale(1.1);} }
    .bg-stars { position:absolute; inset:0; z-index:1; pointer-events:none; }
    .bg-star { position:absolute; background:#fff; border-radius:50%; opacity:0; animation:twinkle var(--dur) ease-in-out infinite; animation-delay:var(--delay); }
    @keyframes twinkle { 0%,100%{opacity:0.05;transform:scale(0.7);} 50%{opacity:var(--max-op,0.5);transform:scale(1.1);} }
    .top-bar { position:fixed; top:max(16px, env(safe-area-inset-top)); left:0; right:0; z-index:20; display:flex; justify-content:space-between; padding:0 20px; pointer-events:none; }
    .top-bar-left { display:flex; flex-direction:column; }
    .brand { font-size:14px; letter-spacing:3px; color:#d4c0b0; font-weight:500; text-shadow:0 0 20px rgba(0,0,0,0.6); }
    .brand small { font-size:11px; color:#8a7a6a; letter-spacing:2px; margin-left:6px; }
    .top-stats { font-size:12px; color:#8a7a6a; letter-spacing:1px; text-shadow:0 0 20px rgba(0,0,0,0.6); }
    .top-stats span { color:#d4c0b0; }
    .bottle-wrapper { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; margin-top:-10px; }
    .bottle-container { width:min(380px, 85vw); cursor:pointer; transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1); animation:floatBottle 7s ease-in-out infinite; filter:drop-shadow(0 16px 60px rgba(0,0,0,0.7)); }
    .bottle-container:active { transform:scale(0.96); }
    @keyframes floatBottle { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-10px) rotate(0.5deg);} }
    .bottle-container.jiggle { animation:bottleJiggle 0.5s ease, floatBottle 7s ease-in-out 0.5s infinite; }
    .bottle-container.big-shake { animation:bottleShake 0.8s ease-in-out; }
    @keyframes bottleJiggle { 0%,100%{transform:rotate(0deg) translateY(0);} 20%{transform:rotate(-3deg) translateY(-5px);} 60%{transform:rotate(3deg) translateY(-4px);} 80%{transform:rotate(-1.5deg) translateY(0);} }
    @keyframes bottleShake { 0%,100%{transform:rotate(0deg) translate(0,0);} 15%{transform:rotate(-7deg) translate(-10px,4px);} 35%{transform:rotate(7deg) translate(10px,-4px);} 55%{transform:rotate(-6deg) translate(-8px,3px);} 75%{transform:rotate(6deg) translate(8px,-3px);} }
    .bottle-svg { width:100%; height:auto; display:block; }
    .star-count-wrap { margin-top:18px; display:flex; align-items:center; gap:28px; z-index:2; flex-wrap:wrap; justify-content:center; }
    .star-count { font-size:16px; color:#b8a08c; letter-spacing:2px; }
    .star-count strong { color:#f5e6d3; font-size:22px; font-weight:700; }
    .star-owner { display:flex; gap:18px; font-size:14px; color:#8a7a6a; }
    .star-owner span { color:#d4c0b0; }
    .star-owner .ink { color:#e8c89e; }
    .star-owner .yyi { color:#a8c8e8; }
    .bottom-menu { position:fixed; bottom:max(28px, env(safe-area-inset-bottom)); left:0; right:0; z-index:20; display:flex; justify-content:center; gap:18px; flex-wrap:wrap; padding:0 16px; }
    .menu-item { display:flex; align-items:center; gap:8px; padding:10px 24px; border-radius:40px; border:1px solid rgba(245,230,211,0.08); background:rgba(11,8,16,0.6); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); color:#d4c0b0; font-size:14px; letter-spacing:1px; cursor:pointer; transition:all 0.3s; }
    .menu-item:hover { background:rgba(245,230,211,0.06); border-color:rgba(212,165,116,0.2); color:#f5e6d3; transform:translateY(-2px); }
    .menu-item:active { transform:scale(0.94); }
    .menu-item .icon { font-size:17px; }
    .menu-item.primary { background:rgba(212,165,116,0.12); border-color:rgba(212,165,116,0.2); color:#f5e6d3; }
    .menu-item.primary:hover { background:rgba(212,165,116,0.2); border-color:rgba(212,165,116,0.35); }
    .shake-trigger { display:inline-flex; align-items:center; gap:8px; padding:10px 22px; border-radius:40px; border:1px solid rgba(245,230,211,0.06); background:rgba(11,8,16,0.5); backdrop-filter:blur(10px); color:#b8a08c; font-size:14px; cursor:pointer; transition:all 0.3s; }
    .shake-trigger:hover { border-color:rgba(212,165,116,0.15); color:#f5e6d3; transform:translateY(-2px); }
    .modal-overlay { position:fixed; inset:0; z-index:100; background:rgba(11,8,16,0.75); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.4s ease; }
    .modal-overlay.active { opacity:1; pointer-events:auto; }
    .modal-card { width:min(480px, 92vw); max-height:90vh; background:linear-gradient(145deg, #1a1524, #130f1a); border-radius:28px; border:1px solid rgba(245,230,211,0.08); padding:24px 22px 20px; transform:scale(0.92) translateY(20px); transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1); overflow-y:auto; }
    .modal-overlay.active .modal-card { transform:scale(1) translateY(0); }
    .modal-card::-webkit-scrollbar { width:4px; }
    .modal-card::-webkit-scrollbar-thumb { background:rgba(212,165,116,0.2); border-radius:4px; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    .modal-header h2 { font-size:18px; letter-spacing:3px; font-weight:500; color:#f5e6d3; }
    .close-btn { width:32px; height:32px; border-radius:50%; border:none; background:rgba(245,230,211,0.06); color:#b8a08c; font-size:18px; cursor:pointer; transition:all 0.2s; }
    .close-btn:hover { background:rgba(245,230,211,0.12); }
    .emotion-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
    .emo-btn { display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 4px; border-radius:16px; border:2px solid rgba(245,230,211,0.08); background:rgba(255,255,255,0.02); cursor:pointer; transition:all 0.25s; }
    .emo-btn .emoji { font-size:22px; }
    .emo-btn .label { font-size:12px; color:#8a7a6a; }
    .emo-btn.selected { border-color:var(--emo-color); background:rgba(255,255,255,0.06); box-shadow:0 0 30px rgba(0,0,0,0.2); }
    .emo-btn.selected .label { color:#f5e6d3; }
    .letter-textarea { width:100%; min-height:120px; background:rgba(255,255,255,0.04); border:1px solid rgba(245,230,211,0.06); border-radius:16px; padding:14px; font-family:inherit; font-size:15px; color:#f0ebe3; resize:vertical; outline:none; line-height:1.8; }
    .letter-textarea::placeholder { color:#5a4a3a; }
    .letter-textarea:focus { border-color:rgba(212,165,116,0.2); }
    .signature-row { display:flex; gap:14px; margin:14px 0; justify-content:center; }
    .sign-btn { padding:8px 22px; border-radius:40px; border:1.5px solid rgba(245,230,211,0.08); background:transparent; color:#8a7a6a; font-family:inherit; font-size:14px; letter-spacing:1px; cursor:pointer; transition:all 0.3s; }
    .sign-btn.active { border-color:var(--sig-color); background:rgba(255,255,255,0.04); color:#f5e6d3; box-shadow:0 0 30px rgba(212,165,116,0.06); }
    .sign-btn.ink.active { --sig-color:#e8c89e; }
    .sign-btn.yyi.active { --sig-color:#a8c8e8; }
    .fold-action { width:100%; padding:14px; border:none; border-radius:60px; background:linear-gradient(135deg, #d4a574, #b08860); color:#0b0810; font-family:inherit; font-size:16px; letter-spacing:3px; cursor:pointer; transition:all 0.3s; font-weight:700; }
    .fold-action:disabled { opacity:0.25; cursor:not-allowed; }
    .archive-grid { display:flex; flex-direction:column; gap:10px; max-height:50vh; overflow-y:auto; padding-right:4px; }
    .archive-grid::-webkit-scrollbar { width:3px; }
    .archive-grid::-webkit-scrollbar-thumb { background:rgba(212,165,116,0.15); border-radius:3px; }
    .archive-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; background:rgba(255,255,255,0.02); border-left:3px solid var(--emo-color); transition:all 0.2s; cursor:pointer; }
    .archive-item:hover { background:rgba(255,255,255,0.05); }
    .archive-item .star-icon { width:20px; height:20px; flex-shrink:0; }
    .archive-item .info { flex:1; min-width:0; }
    .archive-item .info .date { font-size:12px; color:#6a5a4a; }
    .archive-item .info .preview { font-size:13px; color:#d4c0b0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    .archive-item .info .owner { font-size:11px; color:#8a7a6a; }
    .archive-item .badge { font-size:11px; padding:2px 10px; border-radius:20px; background:var(--emo-color); color:#0b0810; flex-shrink:0; }
    .filter-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
    .filter-btn { padding:4px 14px; border-radius:20px; border:1px solid rgba(245,230,211,0.06); background:transparent; color:#8a7a6a; font-size:12px; cursor:pointer; transition:all 0.2s; }
    .filter-btn.active { border-color:rgba(212,165,116,0.2); color:#f5e6d3; background:rgba(212,165,116,0.06); }
    .emotion-effect { position:fixed; inset:0; z-index:5; pointer-events:none; opacity:0; transition:opacity 0.8s ease; }
    .emotion-effect.active { opacity:1; }
    .rain-drop { position:absolute; width:2px; background:rgba(180,210,240,0.35); animation:rainFall linear infinite; border-radius:1px; }
    @keyframes rainFall { 0%{transform:translateY(-20vh) translateX(0) rotate(15deg);} 100%{transform:translateY(120vh) translateX(40px) rotate(15deg);} }
    .fire-particle { position:absolute; border-radius:50%; background:radial-gradient(circle, #ff6b35, #e74c3c); box-shadow:0 0 20px #e74c3c; animation:fireRise linear infinite; }
    @keyframes fireRise { 0%{opacity:0;transform:translateY(0) scale(0.3) rotate(0deg);} 30%{opacity:1;} 100%{opacity:0;transform:translateY(-80vh) scale(1.5) rotate(720deg);} }
    .heart-float { position:absolute; font-size:28px; animation:heartUp linear infinite; opacity:0; text-shadow:0 0 20px rgba(230,126,154,0.3); }
    @keyframes heartUp { 0%{opacity:0;transform:translateY(0) scale(0.5);} 20%{opacity:0.9;} 80%{opacity:0.9;} 100%{opacity:0;transform:translateY(-60vh) scale(1.4);} }
    .wave-ring { position:absolute; border-radius:50%; border:2px solid rgba(72,201,176,0.25); animation:waveExpand 4s ease-out infinite; }
    @keyframes waveExpand { 0%{width:0;height:0;opacity:0.6;} 100%{width:200px;height:200px;opacity:0;} }
    .wind-line { position:absolute; height:2px; background:linear-gradient(90deg, transparent, rgba(142,68,173,0.3), transparent); animation:windLine 2s linear infinite; }
    @keyframes windLine { 0%{transform:translateX(-80px) rotate(var(--rot,0deg));opacity:0;} 20%{opacity:0.6;} 80%{opacity:0.6;} 100%{transform:translateX(80vw) rotate(var(--rot,0deg));opacity:0;} }
    .happy-dust { position:absolute; border-radius:50%; background:radial-gradient(circle, #f9e79f, #f4d03f); box-shadow:0 0 20px #f4d03f; animation:happyDust 3s ease-in-out infinite; }
    @keyframes happyDust { 0%{opacity:0;transform:translate(0,0) scale(0.3);} 50%{opacity:0.9;} 100%{opacity:0;transform:translate(var(--tx,30px),var(--ty,-50px)) scale(1.6);} }
    #detailModal .modal-card { max-height:80vh; }
    #detailContent { white-space:pre-wrap; font-size:16px; line-height:1.8; color:#f0ebe3; margin-bottom:16px; max-height:50vh; overflow-y:auto; }
    #detailResolution { border-top:1px solid rgba(245,230,211,0.1); padding-top:12px; }
    #detailResolutionText { font-size:14px; color:#d4c0b0; white-space:pre-wrap; }
    @media (max-width:480px) {
      .intro-title { font-size:22px; letter-spacing:4px; }
      .bottle-container { width:min(280px, 80vw); }
      .bottom-menu { gap:12px; }
      .menu-item { padding:6px 14px; font-size:12px; }
      .modal-card { padding:18px 16px; }
      .emotion-grid { grid-template-columns:repeat(3,1fr); }
      .top-bar .brand { font-size:12px; }
    }
  </style>
</head>
<body>
  <!-- ===== 开场 ===== -->
  <div id="intro">
    <div class="intro-star"></div>
    <div class="intro-title">✦ 只属于我们的星河</div>
    <div class="intro-sub">Ink × Yyi</div>
    <div class="intro-quote">把想说的话，变成一颗星星，留在我们的宇宙里。</div>
    <button class="intro-btn" id="enterBtn">✦ 进入星河</button>
  </div>

  <!-- ===== 主应用 ===== -->
  <div id="app">
    <div class="galaxy-bg">
      <div class="nebula n1"></div>
      <div class="nebula n2"></div>
      <div class="bg-stars" id="bgStars"></div>
    </div>
    <div class="emotion-effect" id="emotionEffect"></div>

    <div class="top-bar">
      <div class="top-bar-left">
        <div class="brand">只属于我们的星河 <small>Ink × Yyi</small></div>
      </div>
      <div class="top-stats">✦ <span id="totalStars">0</span> 颗星星</div>
    </div>

    <!-- 瓶子 SVG -->
    <div class="bottle-wrapper">
      <div class="bottle-container" id="bottleContainer">
        <svg viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg" class="bottle-svg">
          <defs>
            <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(200,230,250,0.02)"/>
              <stop offset="20%" stop-color="rgba(220,245,255,0.18)"/>
              <stop offset="80%" stop-color="rgba(220,245,255,0.10)"/>
              <stop offset="100%" stop-color="rgba(200,230,250,0.02)"/>
            </linearGradient>
            <linearGradient id="corkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#d4b89a"/><stop offset="50%" stop-color="#b09072"/><stop offset="100%" stop-color="#90725a"/>
            </linearGradient>
            <linearGradient id="metalRing" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#d0c0b0"/><stop offset="50%" stop-color="#b0a090"/><stop offset="100%" stop-color="#908070"/>
            </linearGradient>
            <clipPath id="bottleClip"><rect x="50" y="70" width="180" height="200" rx="20"/></clipPath>
            <filter id="glowTrail" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <ellipse cx="140" cy="278" rx="85" ry="10" fill="rgba(0,0,0,0.30)"/>
          <rect x="112" y="8" width="56" height="10" rx="4" fill="url(#metalRing)" stroke="#f0e0d0" stroke-width="0.4"/>
          <rect x="118" y="18" width="44" height="20" rx="4" fill="url(#corkGrad)"/>
          <rect x="118" y="18" width="44" height="4" rx="4" fill="rgba(0,0,0,0.08)"/>
          <path d="M 116,38 L 116,58 Q 116,66 124,72 L 56,72 L 56,270 Q 56,280 140,280 Q 224,280 224,270 L 224,72 L 156,72 Q 164,66 164,58 L 164,38 Z" fill="url(#glassGrad)" stroke="rgba(180,210,230,0.10)" stroke-width="1.2"/>
          <ellipse cx="140" cy="38" rx="24" ry="3" fill="rgba(180,210,230,0.04)" stroke="rgba(180,210,230,0.08)" stroke-width="0.8"/>
          <g clip-path="url(#bottleClip)" id="bottleStars"></g>
          <path d="M 68,90 L 68,250" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M 212,100 L 212,230" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <ellipse cx="140" cy="268" rx="40" ry="4" fill="rgba(255,255,255,0.04)"/>
        </svg>
      </div>
      <div class="star-count-wrap">
        <div class="star-count">✦ <strong id="starCount">0</strong> 颗星星</div>
        <div class="star-owner"><span class="ink">Ink</span> <span id="inkCount">0</span> · <span class="yyi">Yyi</span> <span id="yyiCount">0</span></div>
      </div>
    </div>

    <div class="bottom-menu">
      <div class="menu-item primary" id="writeBtn"><span class="icon">✎</span> 写星星信</div>
      <div class="menu-item" id="archiveBtn"><span class="icon">✦</span> 星河档案</div>
      <div class="shake-trigger" id="shakeBtn"><span>✦</span> 摇一摇星河</div>
    </div>
  </div>

  <!-- ===== 写信模态框 ===== -->
  <div class="modal-overlay" id="writeModal">
    <div class="modal-card">
      <div class="modal-header"><h2>✎ 写一封星星信</h2><button class="close-btn" id="closeWrite">✕</button></div>
      <div class="emotion-grid" id="emotionGrid"></div>
      <textarea class="letter-textarea" id="letterText" placeholder="把想说的话写下来……会变成一颗星星 ✦" maxlength="5000"></textarea>
      <div class="signature-row">
        <button class="sign-btn ink" data-owner="Ink">Ink</button>
        <button class="sign-btn yyi" data-owner="Yyi">Yyi</button>
      </div>
      <button class="fold-action" id="foldBtn" disabled>✦ 折成星星</button>
    </div>
  </div>

  <!-- ===== 档案模态框 ===== -->
  <div class="modal-overlay" id="archiveModal">
    <div class="modal-card">
      <div class="modal-header"><h2>✦ 星河档案</h2><button class="close-btn" id="closeArchive">✕</button></div>
      <div class="filter-row" id="filterRow"></div>
      <div class="archive-grid" id="archiveGrid"></div>
    </div>
  </div>

  <!-- ===== 详情模态框 ===== -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card" style="max-height:80vh; overflow-y:auto;">
      <div class="modal-header">
        <h2 id="detailEmotion">情绪</h2>
        <button class="close-btn" id="closeDetail">✕</button>
      </div>
      <div style="margin-bottom:12px; color:#b8a08c; font-size:14px;">
        <span id="detailOwner">Ink</span> · <span id="detailDate">2026/08/21</span>
      </div>
      <div id="detailContent" style="white-space:pre-wrap; font-size:16px; line-height:1.8; color:#f0ebe3; margin-bottom:16px;"></div>
      <div id="detailResolution" style="border-top:1px solid rgba(245,230,211,0.1); padding-top:12px;">
        <div style="font-size:13px; color:#8a7a6a; margin-bottom:4px;">✦ 情绪是怎么消解的</div>
        <div id="detailResolutionText" style="font-size:14px; color:#d4c0b0; white-space:pre-wrap;"></div>
      </div>
    </div>
  </div>

  <script type="module">
    // ============================================================
    // Supabase 配置（请根据您的实际项目修改）
    // ============================================================
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL = 'https://fgerhmqwqflgggnqpuas.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_qkiY07ycZktk7tzeEfjT2g_C6hjmpSi'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    // ============================================================
    // 数据状态
    // ============================================================
    let letters = []
    const EMOTIONS = [
      { id:'happy', label:'开心', color:'#F4D03F', emoji:'✨' },
      { id:'sad', label:'难过', color:'#5DADE2', emoji:'🌧️' },
      { id:'angry', label:'生气', color:'#E74C3C', emoji:'🔥' },
      { id:'calm', label:'平静', color:'#48C9B0', emoji:'🌊' },
      { id:'anxious', label:'焦虑', color:'#8E44AD', emoji:'🌀' },
      { id:'miss', label:'想念', color:'#E67E9A', emoji:'💜' }
    ]
    function getEmo(id) { return EMOTIONS.find(e=>e.id===id) || EMOTIONS[0] }

    // ============================================================
    // 离线缓存
    // ============================================================
    function cacheLetters(data) {
      try { localStorage.setItem('offline_letters', JSON.stringify(data)) } catch(e) {}
    }
    function getCachedLetters() {
      try { return JSON.parse(localStorage.getItem('offline_letters') || '[]') } catch(e) { return [] }
    }
    function cachePending(letter) {
      try {
        const q = JSON.parse(localStorage.getItem('pending_letters') || '[]')
        q.push(letter)
        localStorage.setItem('pending_letters', JSON.stringify(q))
      } catch(e) {}
    }
    function getPending() {
      try { return JSON.parse(localStorage.getItem('pending_letters') || '[]') } catch(e) { return [] }
    }
    function clearPending() {
      try { localStorage.removeItem('pending_letters') } catch(e) {}
    }

    // ============================================================
    // 数据操作
    // ============================================================
    async function loadLetters() {
      try {
        const { data, error } = await supabase
          .from('letters')
          .select('*')
          .order('timestamp', { ascending: true })
        if (error) throw error
        letters = data || []
        cacheLetters(letters)
        await syncPending()
        return
      } catch (err) {
        console.warn('加载失败，使用缓存', err)
        letters = getCachedLetters()
      } finally {
        initPhysics()
        updateStats()
        renderArchive()
      }
    }

    async function syncPending() {
      const pending = getPending()
      if (pending.length === 0) return
      let success = []
      for (let p of pending) {
        try {
          const { data, error } = await supabase.from('letters').insert([p]).select()
          if (error) throw error
          if (data && data[0]) success.push(data[0])
        } catch (e) {
          console.warn('同步离线信件失败', p, e)
        }
      }
      if (success.length) {
        const ids = new Set(letters.map(l=>l.id))
        success.forEach(s => { if (!ids.has(s.id)) { letters.push(s); ids.add(s.id) } })
        cacheLetters(letters)
        const remain = getPending().filter(p => !success.some(s => s.id === p.id))
        if (remain.length) localStorage.setItem('pending_letters', JSON.stringify(remain))
        else clearPending()
        initPhysics()
        updateStats()
        renderArchive()
      }
    }

    async function saveLetterToSupabase(letter) {
      try {
        const { data, error } = await supabase.from('letters').insert([letter]).select()
        if (error) throw error
        if (data && data[0]) return data[0]
        return null
      } catch (err) {
        console.warn('保存失败，入离线队列', err)
        cachePending(letter)
        return letter
      }
    }

    // ============================================================
    // 实时订阅
    // ============================================================
    let subscription = null
    function subscribeLetters() {
      if (subscription) return
      subscription = supabase
        .channel('letters-channel')
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'letters'
        }, payload => {
          const newLetter = payload.new
          if (!letters.find(l => l.id === newLetter.id)) {
            letters.push(newLetter)
            cacheLetters(letters)
            addNewStar(newLetter)
            updateStats()
            if (document.getElementById('archiveModal').classList.contains('active')) {
              renderArchive()
            }
          }
        })
        .subscribe()
    }

    // ============================================================
    // 星星物理（完整版）
    // ============================================================
    let activeStars = [], pendingStars = [], physRunning = false, physRaf = null, physLast = 0
    const BOTTLE = { left: 60, right: 220, mouthY: 76, bottomY: (x) => { const cx=140,cy=270,ry=8; const t=(x-cx)/80; return cy+ry*(1-Math.sqrt(1-t*t)); } }
    const PHYS = { gravity: 620, restitution: 0.40, friction: 0.88, drag: 0.992 }
    let releaseAccum = 0
    const TRAIL_LENGTH = 12

    function starColorsFromEmotion(emoId) {
      const emo = getEmo(emoId)
      const base = emo.color
      return { base, light: base+'99', dark: base+'cc', top: '#fff4e0' }
    }

    function makeStarData(letter, entering) {
      const sz = Math.min(24, Math.max(14, 24 - letters.length * 0.05))
      return {
        x: entering ? (120 + Math.random() * 40) : (120 + (Math.random() - 0.5) * 40),
        y: entering ? 20 : 20,
        vx: (Math.random() - 0.5) * 60,
        vy: 0,
        r: sz / 2,
        rot: Math.random() * 360,
        rotV: (Math.random() - 0.5) * 150,
        scale: sz / 100,
        colors: starColorsFromEmotion(letter.emotion),
        letterId: letter.id,
        el: null,
        trail: []
      }
    }

    function buildStarDom(data) {
      const container = document.getElementById('bottleStars')
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      g.setAttribute('class', 'star-group')
      const trailG = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      trailG.setAttribute('class', 'trail-layer')
      trailG.setAttribute('filter', 'url(#glowTrail)')
      const inner = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      inner.setAttribute('class', 'star-inner')
      const c = data.colors
      const faces = `<path d="M 50,8 L 61.8,33.8 L 89.9,37.1 L 69.0,56.2 L 74.7,83.9 L 50,70 L 25.3,83.9 L 31.0,56.2 L 10.1,37.1 L 38.2,33.8 Z" fill="${c.base}" stroke="${c.dark}" stroke-width="1.4" stroke-linejoin="round"/>
        <polygon points="50,30.5 61.8,33.8 50,8" fill="${c.top}"/>
        <polygon points="61.8,33.8 89.9,37.1 50,30.5" fill="${c.light}"/>
        <polygon points="89.9,37.1 69.0,56.2 50,30.5" fill="${c.dark}"/>
        <polygon points="69.0,56.2 50,70 50,30.5" fill="${c.light}"/>
        <polygon points="50,70 25.3,83.9 50,30.5" fill="${c.dark}"/>
        <polygon points="25.3,83.9 31.0,56.2 50,30.5" fill="${c.light}"/>
        <polygon points="31.0,56.2 10.1,37.1 50,30.5" fill="${c.dark}"/>
        <polygon points="10.1,37.1 38.2,33.8 50,30.5" fill="${c.light}"/>
        <polygon points="38.2,33.8 50,8 50,30.5" fill="${c.dark}"/>
        <path d="M 50,30.5 L 50,8 M 65.96,42.14 L 89.9,37.1 M 59.88,60.86 L 74.7,83.9 M 40.12,60.86 L 25.3,83.9 M 34.04,42.14 L 10.1,37.1" stroke="rgba(255,255,255,0.15)" stroke-width="0.8" fill="none"/>`
      inner.innerHTML = faces
      g.appendChild(trailG)
      g.appendChild(inner)
      container.appendChild(g)
      data.el = g
      data.trailEl = trailG
      for (let i = 0; i < TRAIL_LENGTH; i++) {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
        circle.setAttribute('r', '0')
        circle.setAttribute('fill', c.base)
        circle.setAttribute('opacity', '0')
        trailG.appendChild(circle)
      }
      data.trailDots = trailG.querySelectorAll('circle')
    }

    function applyBounds(s, dt, REST, FRIC, G) {
      const r = s.r
      if (s.y < 76) {
        let xl = 116 - 60 * Math.max(0, Math.min(1, (s.y - 38) / 38))
        let xr = 164 + 60 * Math.max(0, Math.min(1, (s.y - 38) / 38))
        if (s.x < xl + r) { s.x = xl + r; if (s.vx < 0) s.vx = -s.vx * REST }
        if (s.x > xr - r) { s.x = xr - r; if (s.vx > 0) s.vx = -s.vx * REST }
      }
      if (s.x < BOTTLE.left + r) { s.x = BOTTLE.left + r; if (s.vx < 0) s.vx = -s.vx * REST }
      if (s.x > BOTTLE.right - r) { s.x = BOTTLE.right - r; if (s.vx > 0) s.vx = -s.vx * REST }
      const by = BOTTLE.bottomY(s.x)
      if (s.y + r > by) {
        s.y = by - r
        if (s.vy > 15) { s.vy = -s.vy * REST; s.rotV += (Math.random() - 0.5) * 80 }
        else { s.vy = 0; s.vx *= 0.85 }
        s.vx *= FRIC
        if (Math.abs(s.vx) < 2) s.vx = 0
      }
      if (s.y - r < BOTTLE.mouthY) { s.y = BOTTLE.mouthY + r; if (s.vy < 0) s.vy = 0 }
      if (s.x < 50) s.x = 50
      if (s.x > 230) s.x = 230
      if (s.y < 10) s.y = 10
      if (s.y > 275) s.y = 275
    }

    function physicsStep(dt) {
      releaseAccum += dt * 40
      let cnt = Math.floor(releaseAccum)
      releaseAccum -= cnt
      while (cnt-- && pendingStars.length) {
        const ps = pendingStars.shift()
        activeStars.push(ps)
        buildStarDom(ps)
      }
      const n = activeStars.length
      if (!n) return
      const G = PHYS.gravity, REST = PHYS.restitution, FRIC = PHYS.friction
      for (let i = 0; i < n; i++) {
        const s = activeStars[i]
        s.vy += G * dt
        s.vx *= Math.pow(PHYS.drag, dt * 60)
        s.vy *= Math.pow(PHYS.drag, dt * 60)
        s.x += s.vx * dt
        s.y += s.vy * dt
        s.rot += s.rotV * dt
        s.rotV *= Math.pow(0.985, dt * 60)
        applyBounds(s, dt, REST, FRIC, G)
      }
      for (let iter = 0; iter < 10; iter++) {
        for (let i = 0; i < n; i++) {
          const a = activeStars[i]
          for (let j = i + 1; j < n; j++) {
            const b = activeStars[j]
            const dx = b.x - a.x, dy = b.y - a.y
            const minD = a.r + b.r
            const d2 = dx * dx + dy * dy
            if (d2 >= minD * minD || d2 < 0.0001) continue
            const d = Math.sqrt(d2)
            const nx = dx / d, ny = dy / d
            const overlap = minD - d
            const wa = b.r / (a.r + b.r), wb = a.r / (a.r + b.r)
            a.x -= nx * overlap * wa
            a.y -= ny * overlap * wa
            b.x += nx * overlap * wb
            b.y += ny * overlap * wb
            const na = a.vx * nx + a.vy * ny, nb = b.vx * nx + b.vy * ny
            const relV = na - nb
            if (relV > 0) {
              if (relV < 20) {
                a.vx -= na * nx; a.vy -= na * ny
                b.vx -= nb * nx; b.vy -= nb * ny
              } else {
                const imp = (1 + REST) * relV * 0.5
                a.vx -= imp * nx; a.vy -= imp * ny
                b.vx += imp * nx; b.vy += imp * ny
                a.rotV += (Math.random() - 0.5) * 30
                b.rotV += (Math.random() - 0.5) * 30
              }
            }
          }
        }
        for (let i = 0; i < n; i++) applyBounds(activeStars[i], dt, REST, FRIC, G)
      }
      for (let i = 0; i < n; i++) {
        const s = activeStars[i]
        if (Math.abs(s.vx) < 4) s.vx = 0
        if (Math.abs(s.vy) < 6) s.vy = 0
        if (Math.abs(s.rotV) < 0.3) s.rotV = 0
      }
    }

    function renderPhys() {
      const n = activeStars.length
      for (let i = 0; i < n; i++) {
        const s = activeStars[i]
        const starInner = s.el.querySelector('.star-inner')
        if (starInner) {
          starInner.setAttribute('transform', `translate(${s.x},${s.y}) rotate(${s.rot}) scale(${s.scale})`)
        }
        const trailG = s.trailEl
        if (trailG) {
          s.trail.push({ x: s.x, y: s.y })
          if (s.trail.length > TRAIL_LENGTH) s.trail.shift()
          const dots = s.trailDots
          const len = s.trail.length
          for (let j = 0; j < dots.length; j++) {
            const idx = j < len ? j : len - 1
            const pos = s.trail[idx] || s.trail[len-1] || { x: s.x, y: s.y }
            const factor = (j + 1) / dots.length
            const alpha = 0.7 * (1 - factor) * 0.9
            const radius = s.r * 0.6 * (1 - factor * 0.5)
            dots[j].setAttribute('cx', pos.x)
            dots[j].setAttribute('cy', pos.y)
            dots[j].setAttribute('r', radius)
            dots[j].setAttribute('opacity', alpha)
            dots[j].setAttribute('fill', s.colors.base)
          }
        }
      }
    }

    function startPhysics() {
      if (physRunning) return
      physRunning = true
      physLast = performance.now()
      function loop(now) {
        const dt = Math.min(0.033, (now - physLast) / 1000)
        physLast = now
        physicsStep(dt)
        renderPhys()
        if (physRunning) physRaf = requestAnimationFrame(loop)
      }
      physRaf = requestAnimationFrame(loop)
    }

    function initPhysics() {
      document.getElementById('bottleStars').innerHTML = ''
      activeStars = []
      pendingStars = []
      releaseAccum = 0
      for (let l of letters) {
        pendingStars.push(makeStarData(l, false))
      }
      startPhysics()
      updateStats()
    }

    function addNewStar(letter) {
      const s = makeStarData(letter, true)
      activeStars.push(s)
      buildStarDom(s)
    }

    function shakeStars() {
      for (let s of activeStars) {
        s.vx += (Math.random() - 0.5) * 700
        s.vy -= 200 + Math.random() * 350
        s.rotV += (Math.random() - 0.5) * 500
      }
    }

    // ============================================================
    // UI 更新
    // ============================================================
    function updateStats() {
      const total = letters.length
      document.getElementById('starCount').textContent = total
      document.getElementById('totalStars').textContent = total
      const ink = letters.filter(l => l.owner === 'Ink').length
      const yyi = letters.filter(l => l.owner === 'Yyi').length
      document.getElementById('inkCount').textContent = ink
      document.getElementById('yyiCount').textContent = yyi
    }

    // ============================================================
    // 🎵 全新音效引擎（无底噪，旋律多变，情绪温和）
    // ============================================================
    let audioCtx = null
    let soundNodes = []
    let loopIntervals = []

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)()
      }
    }

    function stopAllSounds() {
      loopIntervals.forEach(id => clearInterval(id))
      loopIntervals = []
      soundNodes.forEach(n => {
        try { n.stop() } catch(e) {}
        try { n.disconnect() } catch(e) {}
      })
      soundNodes = []
    }

    // 创建持续振荡器
    function createLoopOsc(freq, type = 'sine', volume = 0.03, duration = 9999) {
      const osc = audioCtx.createOscillator()
      osc.type = type
      osc.frequency.value = freq
      const gain = audioCtx.createGain()
      gain.gain.value = volume
      osc.connect(gain)
      gain.connect(audioCtx.destination)
      osc.start()
      osc.stop(audioCtx.currentTime + duration)
      return { osc, gain }
    }

    // 创建雨声（仅用于难过情绪）
    function createRainSound(duration = 9999, amp = 0.08) {
      const sampleRate = audioCtx.sampleRate
      const bufferSize = Math.min(duration * sampleRate, 8 * sampleRate)
      const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate)
      const data = buffer.getChannelData(0)
      for (let i = 0; i < bufferSize; i++) {
        // 模拟雨滴：高频噪声 + 低频调制
        const env = 0.5 + 0.5 * Math.sin(i / 3000)
        data[i] = (Math.random() * 2 - 1) * amp * env * 0.8
      }
      const source = audioCtx.createBufferSource()
      source.buffer = buffer
      source.loop = true
      const gain = audioCtx.createGain()
      gain.gain.value = 1
      source.connect(gain)
      gain.connect(audioCtx.destination)
      source.start()
      return { source, gain }
    }

    // 播放循环和弦（支持动态变化，此处简单用多次调用）
    function playLoopChord(frequencies, volume = 0.025, type = 'sine') {
      const nodes = []
      frequencies.forEach(freq => {
        const { osc, gain } = createLoopOsc(freq, type, volume / frequencies.length, 9999)
        nodes.push(osc, gain)
      })
      return nodes
    }

    // 播放循环琶音（旋律变化）
    function playLoopArpeggio(notes, interval = 0.3, volume = 0.02) {
      let index = 0
      const nodes = []
      const id = setInterval(() => {
        if (!audioCtx) return
        const now = audioCtx.currentTime
        const freq = notes[index % notes.length]
        const osc = audioCtx.createOscillator()
        osc.type = 'sine'
        osc.frequency.value = freq
        const gain = audioCtx.createGain()
        gain.gain.setValueAtTime(volume, now)
        gain.gain.exponentialRampToValueAtTime(volume * 0.001, now + interval * 0.7)
        osc.connect(gain)
        gain.connect(audioCtx.destination)
        osc.start(now)
        osc.stop(now + interval * 0.8)
        nodes.push(osc, gain)
        index++
      }, interval * 1000)
      loopIntervals.push(id)
      return nodes
    }

    // --- 主函数：播放情绪音乐（无底噪，旋律多变） ---
    function playEmotionSound(emoId) {
      initAudio()
      stopAllSounds()
      if (!audioCtx) return

      let allNodes = []

      if (emoId === 'happy') {
        // 明亮 C 大调，和弦进行 C - G - Am - F
        allNodes = allNodes.concat(playLoopChord([523, 659, 784], 0.035))  // C
        allNodes = allNodes.concat(playLoopChord([392, 494, 588], 0.025, 'sine')) // G
        // 琶音旋律：上行 + 下行
        allNodes = allNodes.concat(playLoopArpeggio([523, 587, 659, 784, 880, 784, 659, 587], 0.2, 0.025))
        // 添加一些高音泛音
        allNodes = allNodes.concat(playLoopArpeggio([1047, 1319, 1568], 1.0, 0.015))
      } else if (emoId === 'sad') {
        // 难过：小调背景 + 雨声
        allNodes = allNodes.concat(playLoopChord([440, 554, 659], 0.03))  // Am
        allNodes = allNodes.concat(playLoopChord([330, 415, 494], 0.02))  // Dm
        // 慢速琶音，舒缓
        allNodes = allNodes.concat(playLoopArpeggio([440, 554, 659, 880, 659, 554], 0.6, 0.02))
        // 添加雨声
        const rain = createRainSound(9999, 0.07)
        allNodes.push(rain.source, rain.gain)
      } else if (emoId === 'angry') {
        // 生气：用大调但低音厚实，节奏舒缓不急促
        allNodes = allNodes.concat(playLoopChord([294, 370, 440], 0.04))  // D
        allNodes = allNodes.concat(playLoopChord([220, 330, 370], 0.025)) // A
        // 低音缓慢进行
        allNodes = allNodes.concat(playLoopArpeggio([147, 220, 294, 370, 440], 0.8, 0.02))
        // 增加一个稳定的低音持续
        const bass = createLoopOsc(110, 'sine', 0.02, 9999)
        allNodes.push(bass.osc, bass.gain)
      } else if (emoId === 'calm') {
        // 平静：G 大调，波浪式
        allNodes = allNodes.concat(playLoopChord([392, 494, 588], 0.03))  // G
        allNodes = allNodes.concat(playLoopChord([330, 415, 494], 0.02))  // Em
        // 波浪琶音
        allNodes = allNodes.concat(playLoopArpeggio([392, 440, 494, 588, 494, 440, 392], 0.4, 0.02))
        // 添加一个滑音效果（用正弦波调频）
        const slide = audioCtx.createOscillator()
        slide.type = 'sine'
        slide.frequency.setValueAtTime(440, audioCtx.currentTime)
        slide.frequency.linearRampToValueAtTime(520, audioCtx.currentTime + 4)
        slide.frequency.linearRampToValueAtTime(440, audioCtx.currentTime + 8)
        const gainSlide = audioCtx.createGain()
        gainSlide.gain.value = 0.015
        slide.connect(gainSlide)
        gainSlide.connect(audioCtx.destination)
        slide.start()
        slide.stop(audioCtx.currentTime + 8)
        allNodes.push(slide)
      } else if (emoId === 'anxious') {
        // 焦虑：用 E 大调，稳定呼吸感
        allNodes = allNodes.concat(playLoopChord([330, 415, 494], 0.035))  // E
        allNodes = allNodes.concat(playLoopChord([247, 330, 415], 0.025))  // B
        // 柔和的上升琶音，拉长时间
        allNodes = allNodes.concat(playLoopArpeggio([330, 415, 494, 659, 494, 415], 0.7, 0.015))
        // 添加一个低频心跳
        const pulse = createLoopOsc(0.8, 'sine', 0.02, 9999)
        allNodes.push(pulse.osc, pulse.gain)
      } else if (emoId === 'miss') {
        // 想念：F 大调，温暖
        allNodes = allNodes.concat(playLoopChord([349, 440, 523], 0.04))  // F
        allNodes = allNodes.concat(playLoopChord([392, 494, 588], 0.025)) // C
        // 温柔琶音
        allNodes = allNodes.concat(playLoopArpeggio([349, 440, 523, 659, 523, 440], 0.35, 0.025))
        // 高音点缀
        allNodes = allNodes.concat(playLoopArpeggio([698, 880], 0.8, 0.01))
      }

      allNodes.forEach(n => soundNodes.push(n))
    }

    // ============================================================
    // 情绪特效（视觉增强，更清晰）
    // ============================================================
    function clearEffect() {
      const el = document.getElementById('emotionEffect')
      el.innerHTML = ''
      el.classList.remove('active')
      stopAllSounds()
    }

    function applyEmotionEffect(emoId) {
      clearEffect()
      const el = document.getElementById('emotionEffect')
      if (emoId === 'sad') {
        for (let i = 0; i < 80; i++) {
          const drop = document.createElement('div')
          drop.className = 'rain-drop'
          drop.style.left = Math.random() * 100 + '%'
          drop.style.animationDuration = (0.3 + Math.random() * 0.5) + 's'
          drop.style.animationDelay = (Math.random() * 2) + 's'
          drop.style.height = (12 + Math.random() * 20) + 'px'
          drop.style.opacity = 0.3 + Math.random() * 0.4
          el.appendChild(drop)
        }
        el.classList.add('active')
        playEmotionSound('sad')
      } else if (emoId === 'angry') {
        for (let i = 0; i < 40; i++) {
          const p = document.createElement('div')
          p.className = 'fire-particle'
          p.style.left = Math.random() * 100 + '%'
          p.style.top = (40 + Math.random() * 50) + '%'
          p.style.width = (6 + Math.random() * 14) + 'px'
          p.style.height = p.style.width
          p.style.animationDuration = (0.8 + Math.random() * 1.2) + 's'
          p.style.animationDelay = (Math.random() * 2) + 's'
          el.appendChild(p)
        }
        el.classList.add('active')
        playEmotionSound('angry')
      } else if (emoId === 'miss') {
        const hearts = ['💜', '💕', '✨', '💗', '🌟']
        for (let i = 0; i < 25; i++) {
          const h = document.createElement('div')
          h.className = 'heart-float'
          h.textContent = hearts[i % hearts.length]
          h.style.left = (5 + Math.random() * 90) + '%'
          h.style.bottom = '-10%'
          h.style.animationDuration = (3 + Math.random() * 5) + 's'
          h.style.animationDelay = (Math.random() * 4) + 's'
          h.style.fontSize = (24 + Math.random() * 24) + 'px'
          el.appendChild(h)
        }
        el.classList.add('active')
        playEmotionSound('miss')
      } else if (emoId === 'calm') {
        for (let i = 0; i < 16; i++) {
          const wave = document.createElement('div')
          wave.className = 'wave-ring'
          const size = 40 + Math.random() * 100
          wave.style.width = size + 'px'
          wave.style.height = size + 'px'
          wave.style.left = Math.random() * 100 + '%'
          wave.style.top = Math.random() * 100 + '%'
          wave.style.animationDuration = (3 + Math.random() * 3) + 's'
          wave.style.animationDelay = (Math.random() * 4) + 's'
          wave.style.borderWidth = '3px'
          wave.style.borderColor = 'rgba(72,201,176,0.3)'
          el.appendChild(wave)
        }
        el.classList.add('active')
        playEmotionSound('calm')
      } else if (emoId === 'anxious') {
        for (let i = 0; i < 30; i++) {
          const line = document.createElement('div')
          const rot = Math.random() * 360
          line.className = 'wind-line'
          line.style.left = Math.random() * 100 + '%'
          line.style.top = Math.random() * 100 + '%'
          line.style.setProperty('--rot', rot + 'deg')
          line.style.width = (50 + Math.random() * 80) + 'px'
          line.style.background = 'linear-gradient(90deg, transparent, rgba(142,68,173,0.35), transparent)'
          el.appendChild(line)
        }
        el.classList.add('active')
        playEmotionSound('anxious')
      } else {
        // 开心
        for (let i = 0; i < 50; i++) {
          const dust = document.createElement('div')
          const tx = (Math.random() - 0.5) * 100
          const ty = -20 - Math.random() * 80
          dust.className = 'happy-dust'
          dust.style.left = Math.random() * 100 + '%'
          dust.style.top = Math.random() * 100 + '%'
          dust.style.setProperty('--tx', tx + 'px')
          dust.style.setProperty('--ty', ty + 'px')
          dust.style.width = (4 + Math.random() * 8) + 'px'
          dust.style.height = dust.style.width
          dust.style.animationDuration = (2 + Math.random() * 4) + 's'
          dust.style.animationDelay = (Math.random() * 3) + 's'
          dust.style.background = 'radial-gradient(circle, #f9e79f, #f4d03f)'
          el.appendChild(dust)
        }
        el.classList.add('active')
        playEmotionSound('happy')
      }
    }

    // ============================================================
    // 写信逻辑
    // ============================================================
    let selectedEmotion = null, selectedOwner = null
    function renderEmotions() {
      const grid = document.getElementById('emotionGrid')
      grid.innerHTML = ''
      EMOTIONS.forEach(emo => {
        const btn = document.createElement('div')
        btn.className = 'emo-btn'
        btn.style.setProperty('--emo-color', emo.color)
        btn.dataset.id = emo.id
        btn.innerHTML = `<span class="emoji">${emo.emoji}</span><span class="label">${emo.label}</span>`
        btn.addEventListener('click', () => {
          document.querySelectorAll('.emo-btn').forEach(b => b.classList.remove('selected'))
          btn.classList.add('selected')
          selectedEmotion = emo
          applyEmotionEffect(emo.id)
          updateFoldBtn()
        })
        grid.appendChild(btn)
      })
    }

    function updateFoldBtn() {
      const text = document.getElementById('letterText').value.trim()
      const btn = document.getElementById('foldBtn')
      btn.disabled = !(selectedEmotion && text && selectedOwner)
    }

    document.querySelectorAll('.sign-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.sign-btn').forEach(b => b.classList.remove('active'))
        this.classList.add('active')
        selectedOwner = this.dataset.owner
        updateFoldBtn()
      })
    })
    document.getElementById('letterText').addEventListener('input', updateFoldBtn)

    document.getElementById('foldBtn').addEventListener('click', async function() {
      if (!selectedEmotion || !selectedOwner) return
      const text = document.getElementById('letterText').value.trim()
      if (!text) return
      const letter = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        emotion: selectedEmotion.id,
        emotionLabel: selectedEmotion.label,
        owner: selectedOwner,
        content: text,
        timestamp: Date.now(),
        resolution: ''
      }
      letters.push(letter)
      addNewStar(letter)
      updateStats()
      cacheLetters(letters)
      const saved = await saveLetterToSupabase(letter)
      if (saved && saved.id !== letter.id) {
        const idx = letters.findIndex(l => l.id === letter.id)
        if (idx !== -1) { letters[idx] = saved; cacheLetters(letters) }
      }
      document.getElementById('writeModal').classList.remove('active')
      clearEffect()
      document.querySelectorAll('.emo-btn').forEach(b => b.classList.remove('selected'))
      document.querySelectorAll('.sign-btn').forEach(b => b.classList.remove('active'))
      document.getElementById('letterText').value = ''
      selectedEmotion = null
      selectedOwner = null
      updateFoldBtn()
      const bc = document.getElementById('bottleContainer')
      bc.classList.add('jiggle')
      setTimeout(() => bc.classList.remove('jiggle'), 400)
    })

    // ============================================================
    // 档案 + 详情
    // ============================================================
    let filterEmo = 'all'

    function openDetail(letter) {
      const emo = getEmo(letter.emotion)
      document.getElementById('detailEmotion').textContent = emo.label + ' ' + emo.emoji
      document.getElementById('detailOwner').textContent = letter.owner
      document.getElementById('detailDate').textContent = new Date(letter.timestamp).toLocaleString()
      document.getElementById('detailContent').textContent = letter.content
      const resDiv = document.getElementById('detailResolution')
      const resText = document.getElementById('detailResolutionText')
      if (letter.resolution && letter.resolution.trim()) {
        resDiv.style.display = 'block'
        resText.textContent = letter.resolution
      } else {
        resDiv.style.display = 'none'
      }
      document.getElementById('detailModal').classList.add('active')
    }

    function renderArchive() {
      const grid = document.getElementById('archiveGrid')
      grid.innerHTML = ''
      let filtered = letters
      if (filterEmo !== 'all') filtered = letters.filter(l => l.emotion === filterEmo)
      if (filtered.length === 0) {
        grid.innerHTML = '<div style="color:#5a4a3a;text-align:center;padding:40px 0;">还没有星星 ✦ 去写一封信吧</div>'
        return
      }
      filtered.slice().reverse().forEach(l => {
        const emo = getEmo(l.emotion)
        const div = document.createElement('div')
        div.className = 'archive-item'
        div.style.setProperty('--emo-color', emo.color)
        div.innerHTML = `
          <div class="star-icon">✦</div>
          <div class="info">
            <div class="date">${new Date(l.timestamp).toLocaleDateString()} ${new Date(l.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
            <div class="preview">${l.content.slice(0, 80)}${l.content.length > 80 ? '…' : ''}</div>
            <div class="owner">${l.owner}</div>
          </div>
          <span class="badge">${emo.label}</span>
        `
        div.addEventListener('click', () => openDetail(l))
        grid.appendChild(div)
      })
    }

    function renderFilters() {
      const row = document.getElementById('filterRow')
      row.innerHTML = `<button class="filter-btn active" data-filter="all">全部</button>`
      EMOTIONS.forEach(e => {
        const btn = document.createElement('button')
        btn.className = 'filter-btn'
        btn.dataset.filter = e.id
        btn.textContent = e.label
        btn.addEventListener('click', function() {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
          this.classList.add('active')
          filterEmo = this.dataset.filter
          renderArchive()
        })
        row.appendChild(btn)
      })
    }

    // ============================================================
    // 摇一摇
    // ============================================================
    document.getElementById('shakeBtn').addEventListener('click', () => {
      const bc = document.getElementById('bottleContainer')
      bc.classList.add('big-shake')
      shakeStars()
      setTimeout(() => bc.classList.remove('big-shake'), 800)
    })

    // ============================================================
    // 背景星星
    // ============================================================
    function createBgStars() {
      const c = document.getElementById('bgStars')
      for (let i = 0; i < 60; i++) {
        const s = document.createElement('div')
        s.className = 'bg-star'
        s.style.left = Math.random() * 100 + '%'
        s.style.top = Math.random() * 100 + '%'
        s.style.setProperty('--delay', (Math.random() * 4) + 's')
        s.style.setProperty('--dur', (2 + Math.random() * 5) + 's')
        s.style.setProperty('--max-op', 0.2 + Math.random() * 0.5)
        const sz = 1 + Math.random() * 2.5
        s.style.width = sz + 'px'
        s.style.height = sz + 'px'
        c.appendChild(s)
      }
    }

    // ============================================================
    // 模态控制
    // ============================================================
    function openWrite() {
      document.getElementById('writeModal').classList.add('active')
    }
    function closeWrite() {
      document.getElementById('writeModal').classList.remove('active')
      clearEffect()
    }
    function openArchive() {
      renderArchive()
      document.getElementById('archiveModal').classList.add('active')
    }
    function closeArchive() {
      document.getElementById('archiveModal').classList.remove('active')
    }
    function closeDetail() {
      document.getElementById('detailModal').classList.remove('active')
    }

    document.getElementById('writeBtn').addEventListener('click', openWrite)
    document.getElementById('archiveBtn').addEventListener('click', openArchive)
    document.getElementById('closeWrite').addEventListener('click', closeWrite)
    document.getElementById('closeArchive').addEventListener('click', closeArchive)
    document.getElementById('closeDetail').addEventListener('click', closeDetail)
    document.querySelectorAll('.modal-overlay').forEach(el => {
      el.addEventListener('click', function(e) {
        if (e.target === this) {
          this.classList.remove('active')
          if (this.id === 'writeModal') clearEffect()
        }
      })
    })

    // ============================================================
    // 进入
    // ============================================================
    document.getElementById('enterBtn').addEventListener('click', () => {
      document.getElementById('intro').classList.add('hidden')
      document.getElementById('app').classList.add('ready')
      setTimeout(() => { document.getElementById('intro').style.display = 'none' }, 1200)
    })

    // ============================================================
    // 初始化
    // ============================================================
    createBgStars()
    renderEmotions()
    renderFilters()

    await loadLetters()
    subscribeLetters()

    console.log('✦ 只属于我们的星河 · Ink × Yyi (纯净音效+清晰特效)')
  </script>
</body>
</html>
