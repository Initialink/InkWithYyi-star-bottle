<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
    name="theme-color"

<title>Ink × Yyi · Our Star Bottle</title>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    font-family:
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "PingFang SC",
        serif;

    background:#08070d;
    color:white;
}

button,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   世界
========================================================= */

#world{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 38%,
            #302640 0%,
            #0a080f 68%,
            #030207 100%
        );

    transition:
        background 1s ease;
}

#fx{
    position:absolute;
    inset:0;

    overflow:hidden;

    pointer-events:none;
}

#vignette{
    position:absolute;
    inset:-10%;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            transparent 35%,
            rgba(0,0,0,.8) 100%
        );
}


/* =========================================================
   开场
========================================================= */

#gate{
    position:fixed;
    inset:0;

    z-index:9999;

    display:grid;
    place-items:center;

    background:
        radial-gradient(
            circle at 50% 40%,
            #30253f,
            #08070d 72%
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#gate.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.intro{
    width:min(90vw,520px);
    text-align:center;
}

.big{
    font-size:92px;
    color:#e9d98f;

    text-shadow:
        0 0 18px #e9d98f,
        0 0 55px rgba(233,217,143,.6);

    animation:
        breathe 4s ease-in-out infinite;
}

@keyframes breathe{

    50%{
        transform:
            translateY(-8px)
            scale(1.05);

        opacity:.72;
    }

}

.intro h1{
    margin:18px 0 10px;

    font-size:38px;
    font-weight:400;

    letter-spacing:8px;
}

.intro p{
    margin:0 0 28px;

    color:#aaa0b1;

    line-height:2;
}

.enter{

    border:
        1px solid
        rgba(215,197,140,.4);

    background:
        rgba(255,255,255,.07);

    color:#eee5d9;

    border-radius:999px;

    padding:
        13px 25px;

    transition:.25s;
}

.enter:hover{

    background:
        rgba(255,255,255,.15);

    transform:
        translateY(-2px);

    box-shadow:
        0 0 25px
        rgba(220,200,140,.16);
}


/* =========================================================
   主界面
========================================================= */

main{
    position:relative;

    z-index:20;

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}

.top{

    position:fixed;

    top:
        max(16px,env(safe-area-inset-top));

    left:22px;
    right:22px;

    display:flex;

    justify-content:space-between;

    color:#a69aaa;

    font-size:10px;

    letter-spacing:3px;
}


/* =========================================================
   瓶子
========================================================= */

.bottle{

    position:relative;

    width:min(440px,90vw);

    height:min(640px,72vh);

    filter:
        drop-shadow(
            0 30px 55px
            rgba(0,0,0,.75)
        )
        drop-shadow(
            0 0 35px
            rgba(153,120,220,.12)
        );

    transform-origin:center;
}

#glass{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:5;

    pointer-events:none;
}


/*
    这里不再用 DOM 星星 + Matter.js。
    一个 canvas 统一负责：
    物理、碰撞、绘制、拖尾。
*/

#starCanvas{

    position:absolute;

    left:16%;
    right:16%;

    top:25%;
    bottom:7%;

    width:68%;
    height:68%;

    z-index:4;

    pointer-events:auto;
}


/* =========================================================
   数据
========================================================= */

.stats{

    display:flex;

    gap:28px;

    color:#aaa0b0;

    font-size:12px;
}

.stats b{

    color:#e9d68d;

    font-size:18px;

    font-weight:400;
}

.actions{

    display:flex;

    gap:8px;

    margin-top:12px;

    flex-wrap:wrap;

    justify-content:center;
}

.btn{

    border:
        1px solid
        rgba(215,197,140,.35);

    background:
        rgba(255,255,255,.06);

    color:#eee5d9;

    border-radius:999px;

    padding:
        10px 18px;

    transition:.25s;
}

.btn:hover{

    background:
        rgba(255,255,255,.13);

    transform:
        translateY(-2px);
}

.btn:active{

    transform:
        scale(.97);
}


/* =========================================================
   全屏特效
========================================================= */

.p{

    position:absolute;

    pointer-events:none;
}


/* 雨 */

.rain{

    width:1px;
    height:85px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(220,240,255,.95)
        );

    opacity:.58;

    animation:
        rainFall linear infinite;
}

@keyframes rainFall{

    from{

        transform:
            translate3d(
                0,
                -120px,
                0
            )
            rotate(10deg);

    }

    to{

        transform:
            translate3d(
                -120px,
                120vh,
                0
            )
            rotate(10deg);

    }

}


/* 火 */

.ember{

    width:4px;
    height:18px;

    border-radius:50%;

    background:#ff634f;

    box-shadow:
        0 0 8px #ff4a38,
        0 0 24px #ff321f;

    animation:
        emberUp linear infinite;
}

@keyframes emberUp{

    from{

        transform:
            translate3d(
                0,
                110vh,
                0
            );

        opacity:0;
    }

    15%{
        opacity:1;
    }

    to{

        transform:
            translate3d(
                -60px,
                -20vh,
                0
            )
            rotate(180deg);

        opacity:0;
    }

}


/* 星光 */

.spark{

    width:4px;
    height:4px;

    border-radius:50%;

    background:currentColor;

    box-shadow:
        0 0 15px currentColor;

    animation:
        sparkMove linear infinite;
}

@keyframes sparkMove{

    0%{

        transform:
            translate3d(
                0,
                20px,
                0
            )
            scale(.5);

        opacity:0;
    }

    30%{
        opacity:1;
    }

    60%{

        transform:
            translate3d(
                30px,
                -40px,
                0
            )
            scale(1.7);

    }

    100%{

        transform:
            translate3d(
                -25px,
                -120vh,
                0
            )
            scale(.2);

        opacity:0;
    }

}


/* 平静 */

.wave{

    width:20px;
    height:20px;

    border:
        1px solid
        currentColor;

    border-radius:50%;

    animation:
        waveExpand ease-out infinite;
}

@keyframes waveExpand{

    0%{

        opacity:.65;

        transform:
            translate(-50%,-50%)
            scale(.1);

    }

    100%{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(35);

    }

}


/* 焦虑 */

.wind{

    width:35vw;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            currentColor,
            transparent
        );

    box-shadow:
        0 0 8px currentColor;

    animation:
        windMove linear infinite;
}

@keyframes windMove{

    from{
        transform:
            translateX(-100vw);
    }

    to{
        transform:
            translateX(180vw);
    }

}


/* =========================================================
   弹窗
========================================================= */

.panel{

    position:fixed;

    inset:0;

    z-index:500;

    display:none;

    align-items:center;

    justify-content:center;

.card{

/* =========================================================
   情绪
========================================================= */

.emotions{

    display:grid;

.emotion{

    color:#463940;

    transition:.2s;
}

.emotion.on{

    outline:
        2px solid
        var(--c);

        0 0 14px
        var(--c);
}

.dot{

    width:22px;
    height:22px;

    margin:
        0 auto 5px;

    border-radius:50%;

    background:
        var(--c);

    box-shadow:
        0 0 8px var(--c),
        0 0 18px var(--c);
}


/* =========================================================
   写信
========================================================= */

textarea{

    height:300px;

    margin-top:12px;

    outline:0;

    resize:none;

.sign{

.sign button{

.sign button.on{

}

.row{

}

.primary{

    padding:

/* =========================================================
   信件
========================================================= */

.note{

.tag{

.who{

.note p{

.note small{

/* =========================================================

========================================================= */

.status{

/* =========================================================

    }

}

</style>

<script>

/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
    "https://fgerhmqwqflgggnqpuas.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qkiY07ycZktk7tzeEfjT2g_C6hjmpSi";

const ROOM =
    "ink-yyi";


let db = null;

let channel = null;


/* =========================================================
   数据
========================================================= */

let letters = [];

let currentWho = "Ink";

let currentEmotion = 0;


/* =========================================================
   六情绪
========================================================= */

const EMOTIONS = [

    {
        name:"开心",
        color:"#f4d24f",
        key:"happy"
    },

    {
        name:"难过",
        color:"#78a9df",
        key:"sad"
    },

    {
        name:"生气",
        color:"#ef5a4f",
        key:"angry"
    },

    {
        name:"平静",
        color:"#79c8b1",
        key:"calm"
    },

    {
        name:"焦虑",
        color:"#b58bd8",
        key:"anxious"
    },

    {
        name:"想念",
        color:"#8c78e8",
        key:"miss"
    }

];


/* =========================================================
   DOM
========================================================= */

const $ =
    id =>
        document.getElementById(id);


/* =========================================================
   状态
========================================================= */

function status(text){

    $("status").textContent =
        text;

}


/* =========================================================
   Supabase
========================================================= */

function initCloud(){

    try{

        if(
            window.supabase &&
            typeof window.supabase.createClient ===
            "function"
        ){

            db =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );

            return true;

        }

    }catch(e){

        console.warn(e);

    }

    return false;
}


/* =========================================================
   读取云端
========================================================= */

async function loadLetters(){

    if(!db){

        initCloud();

    }

    if(!db){

        loadLocal();

        renderAll();

        return;

    }


    try{

        const result =
            await db
                .from("star_letters")
                .select("*")
                .eq("room",ROOM)
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                );


        if(result.error){

            console.warn(
                result.error
            );

            loadLocal();

        }else{

            letters =
                result.data || [];

        }


        renderAll();


        /*
         * 实时双向同步。
         */

        if(channel){

            try{

                await db.removeChannel(
                    channel
                );

            }catch(e){}

        }


        channel =
            db
                .channel(
                    "star-bottle-" +
                    ROOM
                )
                .on(
                    "postgres_changes",
                    {
                        event:"INSERT",
                        schema:"public",
                        table:"star_letters",
                        filter:
                            "room=eq." + ROOM
                    },
                    payload => {

                        const incoming =
                            payload.new;


                        if(
                            !letters.some(
                                x =>
                                    String(x.id) ===
                                    String(incoming.id)
                            )
                        ){

                            letters.push(
                                incoming
                            );


                            renderAll();

                        }

                    }
                )
                .subscribe(
                    () => {}
                );


        status(
            "● 已连接 · 两个人共享同一瓶"
        );

    }catch(error){

        console.warn(
            error
        );

        loadLocal();

        renderAll();

    }

}


/* =========================================================
   本地备用
========================================================= */

function loadLocal(){

    try{

        letters =
            JSON.parse(
                localStorage.getItem(
                    "ink-yyi-stars"
                ) || "[]"
            );

    }catch(e){

        letters = [];

    }

}


function saveLocal(){

    try{

        localStorage.setItem(
            "ink-yyi-stars",
            JSON.stringify(
                letters
            )
        );

    }catch(e){}

}


/* =========================================================
   HTML 安全
========================================================= */

function safe(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   情绪颜色
========================================================= */

function colorFor(letter){

    if(letter && letter.color){

        return letter.color;

    }


    const found =
        EMOTIONS.find(
            x =>
                x.name ===
                letter?.emotion
        );


    return found
        ? found.color
        : "#f4d24f";

}


/* =========================================================
   Canvas 物理
========================================================= */

const canvas =
    $("starCanvas");

const ctx =
    canvas.getContext("2d");


let physics = [];


let canvasWidth = 0;

let canvasHeight = 0;


/* =========================================================
   尺寸
========================================================= */

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();


    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvasWidth =
        rect.width;


    canvasHeight =
        rect.height;


    canvas.width =
        Math.round(
            rect.width *
            ratio
        );


    canvas.height =
        Math.round(
            rect.height *
            ratio
        );


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    /*
     * 调整后把星星强制留在瓶子内部。
     */

    physics.forEach(
        star => {

            star.x =
                Math.max(
                    star.r,
                    Math.min(
                        canvasWidth-star.r,
                        star.x
                    )
                );


            star.y =
                Math.max(
                    star.r,
                    Math.min(
                        canvasHeight-star.r,
                        star.y
                    )
                );

        }
    );

}

/* =========================================================
   创建星星
========================================================= */

function createStar(
    letter,
    index
){

    const r =
        7 +
        Math.random()*3;


    const padding =
        r + 3;


    const star = {

        id:
            String(
                letter.id ??
                index
            ),

        letter,

        x:
            padding +
            Math.random() *
            Math.max(
                1,
                canvasWidth -
                padding*2
            ),

        y:
            padding +
            Math.random() *
            Math.max(
                1,
                canvasHeight -
                padding*2
            ),

        vx:
            (
                Math.random() -
                .5
            ) *
            .35,

        vy:
            (
                Math.random() -
                .5
            ) *
            .35,

        r,

        angle:
            Math.random() *
            Math.PI*2,

        spin:
            (
                Math.random() -
                .5
            ) *
            .015,

        color:
            colorFor(letter),

        trail:[]

    };


    return star;

}


/* =========================================================
   完全重建物理星星
========================================================= */

function rebuildPhysics(){

    resizeCanvas();


    /*
     * 每封信只对应一颗星。
     * 不再有第二套 Matter 状态。
     */

    physics =
        letters.map(
            (letter,index) =>
                createStar(
                    letter,
                    index
                )
        );


    /*
     * 防止星星一开始重叠。
     */

    for(
        let pass=0;
        pass<20;
        pass++
    ){

        for(
            let i=0;
            i<physics.length;
            i++
        ){

            for(
                let j=i+1;
                j<physics.length;
                j++
            ){

                separate(
                    physics[i],
                    physics[j]
                );

            }

        }

    }

}


/* =========================================================
   碰撞分离
========================================================= */

function separate(a,b){

    const dx =
        b.x-a.x;

    const dy =
        b.y-a.y;


    let distance =
        Math.hypot(
            dx,
            dy
        );


    const minimum =
        a.r+b.r+2;


    if(
        distance === 0
    ){

        distance = .001;

    }


    if(
        distance < minimum
    ){

        const nx =
            dx/distance;

        const ny =
            dy/distance;


        const overlap =
            minimum-distance;


        a.x -=
            nx *
            overlap *
            .5;


        a.y -=
            ny *
            overlap *
            .5;


        b.x +=
            nx *
            overlap *
            .5;


        b.y +=
            ny *
            overlap *
            .5;

    }

}


/* =========================================================
   星星碰撞
========================================================= */

function collide(a,b){

    const dx =
        b.x-a.x;

    const dy =
        b.y-a.y;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    const minimum =
        a.r+b.r;


    if(
        distance === 0 ||
        distance >= minimum
    ){

        return;

    }


    const nx =
        dx/distance;

    const ny =
        dy/distance;


    const overlap =
        minimum-distance;


    /*
     * 位置修正。
     */

    a.x -=
        nx *
        overlap *
        .5;

    a.y -=
        ny *
        overlap *
        .5;

    b.x +=
        nx *
        overlap *
        .5;

    b.y +=
        ny *
        overlap *
        .5;


    /*
     * 相对速度。
     */

    const rvx =
        b.vx-a.vx;

    const rvy =
        b.vy-a.vy;


    const velocityAlongNormal =
        rvx*nx+
        rvy*ny;


    if(
        velocityAlongNormal > 0
    ){

        return;

    }


    const restitution =
        .88;


    const impulse =
        -(
            1+restitution
        ) *
        velocityAlongNormal /
        2;


    const ix =
        impulse*nx;

    const iy =
        impulse*ny;


    a.vx -= ix;
    a.vy -= iy;

    b.vx += ix;
    b.vy += iy;


    a.spin -=
        impulse*.002;

    b.spin +=
        impulse*.002;

}


/* =========================================================
   瓶壁碰撞
========================================================= */

function wallCollision(star){

    const r =
        star.r;


    if(
        star.x-r < 0
    ){

        star.x = r;

        star.vx =
            Math.abs(
                star.vx
            )*.92;

    }


    if(
        star.x+r >
        canvasWidth
    ){

        star.x =
            canvasWidth-r;

        star.vx =
            -Math.abs(
                star.vx
            )*.92;

    }


    if(
        star.y-r < 0
    ){

        star.y = r;

        star.vy =
            Math.abs(
                star.vy
            )*.92;

    }


    if(
        star.y+r >
        canvasHeight
    ){

        star.y =
            canvasHeight-r;

        star.vy =
            -Math.abs(
                star.vy
            )*.88;

    }

}


/* =========================================================
   画星星
========================================================= */

function drawStar(
    star
){

    ctx.save();


    ctx.translate(
        star.x,
        star.y
    );


    ctx.rotate(
        star.angle
    );


    /*
     * 光晕。
     */

    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        star.color;


    ctx.fillStyle =
        star.color;


    ctx.beginPath();


    for(
        let i=0;
        i<10;
        i++
    ){

        const angle =
            -Math.PI/2 +
            i*Math.PI/5;


        const radius =
            i%2 === 0
            ? star.r
            : star.r*.42;


        const x =
            Math.cos(angle)*
            radius;


        const y =
            Math.sin(angle)*
            radius;


        if(i===0){

            ctx.moveTo(
                x,
                y
            );

        }else{

            ctx.lineTo(
                x,
                y
            );

        }

    }


    ctx.closePath();

    ctx.fill();


    /*
     * 中心亮点。
     */

    ctx.shadowBlur =
        0;

    ctx.fillStyle =
        "rgba(255,255,255,.8)";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        1.5,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   物理循环
========================================================= */

let lastTime =
    performance.now();


function physicsLoop(now){

    const dt =
        Math.min(
            (now-lastTime)/16.666,
            2
        );


    lastTime =
        now;


    ctx.clearRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );


    /*
     * 更新。
     */

    physics.forEach(
        star => {

            /*
             * 微弱重力。
             */

            star.vy +=
                .018 *
                dt;


            /*
             * 空气阻力。
             */

            star.vx *=
                Math.pow(
                    .992,
                    dt
                );

            star.vy *=
                Math.pow(
                    .992,
                    dt
                );


            star.x +=
                star.vx *
                dt;


            star.y +=
                star.vy *
                dt;


            star.angle +=
                star.spin *
                dt;


            /*
             * 拖尾。
             */

            if(
                Math.abs(star.vx)+
                Math.abs(star.vy) >
                .4
            ){

                star.trail.push({

                    x:star.x,

                    y:star.y,

                    alpha:.6

                });

            }


            if(
                star.trail.length >
                9
            ){

                star.trail.shift();

            }


            star.trail.forEach(
                t => {

                    t.alpha *=
                        .82;

                }
            );


            wallCollision(
                star
            );

        }
    );


    /*
     * 星星互撞。
     */

    for(
        let i=0;
        i<physics.length;
        i++
    ){

        for(
            let j=i+1;
            j<physics.length;
            j++
        ){

            collide(
                physics[i],
                physics[j]
            );

        }

    }


    /*
     * 先画拖尾。
     */

    physics.forEach(
        star => {

            star.trail.forEach(
                t => {

                    ctx.globalAlpha =
                        t.alpha;


                    ctx.fillStyle =
                        star.color;


                    ctx.shadowBlur =
                        12;

                    ctx.shadowColor =
                        star.color;


                    ctx.beginPath();

                    ctx.arc(
                        t.x,
                        t.y,
                        2,
                        0,
                        Math.PI*2
                    );

                    ctx.fill();

                }
            );

        }
    );


    ctx.globalAlpha =
        1;


    /*
     * 再画星星。
     */

    physics.forEach(
        drawStar
    );


    requestAnimationFrame(
        physicsLoop
    );

}

/* =========================================================
   音频
========================================================= */

let audioCtx = null;

let audioMaster = null;

let audioSources = [];


function stopAudio(){

    audioSources.forEach(
        source => {

            try{

                source.stop();

            }catch(e){}

        }
    );


    audioSources = [];


    if(audioCtx){

        try{

            audioCtx.close();

        }catch(e){}

    }


    audioCtx = null;

    audioMaster = null;

}


/* =========================================================
   白噪音
========================================================= */

function noiseBuffer(
    seconds
){

    const buffer =
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate *
            seconds,
            audioCtx.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    for(
        let i=0;
        i<data.length;
        i++
    ){

        data[i] =
            Math.random()*2-1;

    }


    return buffer;

}


/* =========================================================
   情绪声音
========================================================= */

function startSound(
    emotion
){

    stopAudio();


    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AudioContext){

            return;

        }


        audioCtx =
            new AudioContext();


        audioMaster =
            audioCtx.createGain();


        audioMaster.gain.value =
            .14;


        audioMaster.connect(
            audioCtx.destination
        );


        const tones = {

            happy:
                [523.25,659.25,783.99],

            sad:
                [196,246.94,293.66],

            angry:
                [73.42,92.5,110],

            calm:
                [174.61,220,261.63],

            anxious:
                [146.83,220,329.63],

            miss:
                [261.63,329.63,392]

        };


        const frequencies =
            tones[
                emotion.key
            ] ||
            tones.calm;


        frequencies.forEach(
            (frequency,index) => {

                const osc =
                    audioCtx.createOscillator();


                const gain =
                    audioCtx.createGain();


                osc.type =
                    emotion.key === "angry"
                    ? "sawtooth"
                    : "sine";


                osc.frequency.value =
                    frequency;


                gain.gain.value =
                    .025;


                osc
                    .connect(gain)
                    .connect(audioMaster);


                osc.start();


                audioSources.push(
                    osc
                );

            }
        );


        /*
         * 难过：
         * 雨 + 白噪音。
         */

        if(
            emotion.key === "sad"
        ){

            const rain =
                audioCtx.createBufferSource();


            const gain =
                audioCtx.createGain();


            const filter =
                audioCtx.createBiquadFilter();


            rain.buffer =
                noiseBuffer(2);


            rain.loop =
                true;


            filter.type =
                "lowpass";


            filter.frequency.value =
                3000;


            gain.gain.value =
                .09;


            rain
                .connect(filter)
                .connect(gain)
                .connect(audioMaster);


            rain.start();


            audioSources.push(
                rain
            );

        }


        /*
         * 开心空气声。
         */

        if(
            emotion.key === "happy"
        ){

            const air =
                audioCtx.createBufferSource();


            const gain =
                audioCtx.createGain();


            const filter =
                audioCtx.createBiquadFilter();


            air.buffer =
                noiseBuffer(1);


            air.loop =
                true;


            filter.type =
                "highpass";


            filter.frequency.value =
                1500;


            gain.gain.value =
                .018;


            air
                .connect(filter)
                .connect(gain)
                .connect(audioMaster);


            air.start();


            audioSources.push(
                air
            );

        }


        audioCtx.resume();

    }catch(e){

        console.warn(
            "audio",
            e
        );

    }

}

function particle(
    type,
    color,
    count
){

    const fragment =
        document.createDocumentFragment();


    for(
        let i=0;
        i<count;
        i++
    ){

        const p =
            document.createElement("i");


        p.className =
            "p " + type;


        p.style.left =
            Math.random()*100+
            "%";


        p.style.top =
            Math.random()*100+
            "%";


        p.style.color =
            color;


        p.style.animationDuration =
            (
                .5+
                Math.random()*5
            )+
            "s";


        p.style.animationDelay =
            (
                -Math.random()*5
            )+
            "s";


        fragment.appendChild(
            p
        );

    }


    $("fx").appendChild(
        fragment
    );

}

async function saveLetter(){

    const text =
        $("text")
            .value
            .trim();


    if(!text){

        $("text").focus();

        return;

    }


    const emotion =
        EMOTIONS[
            currentEmotion
        ];


    const row = {

        room:
            ROOM,

        text:
            text,

        emotion:
            emotion.name,

        color:
            emotion.color,

        who:
            currentWho

    };


    status(
        "● 正在把信折成星星……"
    );


    let saved =
        false;


    if(
        db
    ){

        try{

            const result =
                await db
                    .from("star_letters")
                    .insert(row)
                    .select()
                    .single();


            if(
                !result.error
            ){

                letters.push(
                    result.data
                );


                saved =
                    true;

            }

        }catch(e){

            console.warn(e);

        }

    }


    /*
     * 云端失败时不丢信。
     */

    if(!saved){

        const local = {

            ...row,

            id:
                "local-" +
                Date.now(),

            created_at:
                new Date()
                    .toISOString()

        };


        letters.push(
            local
        );


        saveLocal();

    }


    $("text").value =
        "";


    closeComposer();


    renderAll();


    /*
     * 新星星产生时，
     * 给它一点向上弹出的速度。
     */

    const newest =
        physics[
            physics.length-1
        ];


    if(newest){

        newest.vy =
            -2.5;

        newest.vx =
            (
                Math.random()-.5
            )*2;

    }


    status(
        "● 星星已经留下"
    );

}

                            ${safe(
                                letter.text
                            )}
                        </p>


                        <small>
                            ${
                                letter.created_at
                                ? new Date(
                                    letter.created_at
                                ).toLocaleString(
                                    "zh-CN"
                                )
                                : ""
                            }
                        </small>

                    </article>

                `
            )
            .join("");

}


/* =========================================================
   开场
========================================================= */

function openStarBottle(){

    $("gate")
        .classList
        .add("hide");


    resizeCanvas();


    renderAll();


    loadLetters();


    status(
        "● 星星瓶已打开"
    );

}


/* =========================================================
   事件
========================================================= */

$("enter").onclick =
    openStarBottle;


$("write").onclick =
    openComposer;


$("close").onclick =
    closeComposer;


$("fold").onclick =
    saveLetter;


$("archive").onclick =
    openArchive;


$("shake").onclick =
    () =>
        shakeBottle(1);


$("closeBox").onclick =
    () => {

        $("box")
            .classList
            .remove("open");

    };


/* =========================================================
   签名
========================================================= */

document
    .querySelectorAll(
        ".sign button"
    )
    .forEach(
        button => {

            button.onclick =
                () => {

                    currentWho =
                        button.dataset.who;


                    document
                        .querySelectorAll(
                            ".sign button"
                        )
                        .forEach(
                            x => {

                                x.classList.toggle(
                                    "on",
                                    x === button
                                );

                            }
                        );

                };

        }
    );


/* =========================================================
   弹窗点击外部关闭
========================================================= */

$("compose").onclick =
    event => {

        if(
            event.target ===
            $("compose")
        ){

            closeComposer();

        }

    };


$("box").onclick =
    event => {

        if(
            event.target ===
            $("box")
        ){

            $("box")
                .classList
                .remove("open");

        }

    };


/* =========================================================
   手机摇一摇
========================================================= */

let lastShake =
    0;


window.addEventListener(
    "devicemotion",
    event => {

        const a =
            event.accelerationIncludingGravity;


        if(!a){

            return;

        }


        const strength =
            Math.hypot(
                a.x || 0,
                a.y || 0,
                a.z || 0
            );


        const now =
            Date.now();


        if(
            strength > 20 &&
            now-lastShake > 650
        ){

            lastShake =
                now;


            shakeBottle(.8);

        }

    }
);


/* =========================================================
   日期
========================================================= */

$("date").textContent =
    new Date().toLocaleDateString(
        "zh-CN",
        {
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );


/* =========================================================
   启动
========================================================= */

resizeCanvas();

requestAnimationFrame(
    physicsLoop
);


/*
 * Supabase defer 加载完成后，
 * 再初始化。
 */

window.addEventListener(
    "load",
    () => {

        initCloud();

    }
);
