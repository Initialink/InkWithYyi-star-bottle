<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<title>Ink × Yyi · Our Star Bottle</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:"Noto Serif SC","Songti SC","PingFang SC",serif;
    color:#fff;
    background:#07060d;
}

button,textarea{font:inherit}
button{cursor:pointer}

#world{
    position:fixed;
    inset:0;
    overflow:hidden;
    transition:background 1s ease;
    background:
        radial-gradient(circle at 50% 38%,#302640 0%,#0a080f 68%,#030207 100%);
}

#vignette{
    position:absolute;
    inset:-10%;
    pointer-events:none;
    background:radial-gradient(circle,transparent 40%,rgba(0,0,0,.75) 100%);
    z-index:5;
}

#fx{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

/* =========================
   情绪特效
========================= */

.p{
    position:absolute;
    pointer-events:none;
}

.rain{
    width:1px;
    height:85px;
    background:linear-gradient(
        to bottom,
        transparent,
        rgba(220,240,255,.9)
    );
    opacity:.5;
    animation:rainFall linear infinite;
}

@keyframes rainFall{
    from{
        transform:translate3d(0,-120px,0) rotate(10deg);
    }
    to{
        transform:translate3d(-120px,120vh,0) rotate(10deg);
    }
}

.ember{
    width:4px;
    height:18px;
    border-radius:50%;
    background:#ff634f;
    box-shadow:
        0 0 8px #ff4a38,
        0 0 24px #ff321f;
    animation:emberUp linear infinite;
}

@keyframes emberUp{
    from{
        transform:translate3d(0,110vh,0) rotate(0);
        opacity:0;
    }
    15%{opacity:1}
    to{
        transform:translate3d(-60px,-20vh,0) rotate(180deg);
        opacity:0;
    }
}

.spark{
    width:4px;
    height:4px;
    border-radius:50%;
    background:currentColor;
    box-shadow:0 0 15px currentColor;
    animation:sparkMove linear infinite;
}

@keyframes sparkMove{
    0%{
        transform:translate3d(0,20px,0) scale(.5);
        opacity:0;
    }
    30%{opacity:1}
    60%{
        transform:translate3d(30px,-40px,0) scale(1.7);
    }
    100%{
        transform:translate3d(-25px,-120vh,0) scale(.2);
        opacity:0;
    }
}

.wave{
    width:20px;
    height:20px;
    border:1px solid currentColor;
    border-radius:50%;
    animation:waveExpand ease-out infinite;
}

@keyframes waveExpand{
    0%{
        opacity:.65;
        transform:translate(-50%,-50%) scale(.1);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(35);
    }
}

.wind{
    width:35vw;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        currentColor,
        transparent
    );
    box-shadow:0 0 8px currentColor;
    animation:windMove linear infinite;
}

@keyframes windMove{
    from{
        transform:translateX(-100vw);
    }
    to{
        transform:translateX(180vw);
    }
}

/* =========================
   开场
========================= */

#gate{
    position:fixed;
    inset:0;
    z-index:100;
    display:grid;
    place-items:center;
    background:
        radial-gradient(
            circle at 50% 40%,
            #30253f,
            #08070d 70%
        );
    transition:opacity .8s ease,visibility .8s ease;
}

#gate.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.intro{
    width:min(90vw,520px);
    text-align:center;
}

.big{
    font-size:92px;
    line-height:1;
    color:#e9d98f;
    text-shadow:
        0 0 20px #e9d98f,
        0 0 60px #cdbb70;
    animation:breathe 4s ease-in-out infinite;
}

@keyframes breathe{
    50%{
        transform:translateY(-8px) scale(1.05);
        opacity:.7;
    }
}

.intro h1{
    margin:18px 0 10px;
    font-size:38px;
    font-weight:400;
    letter-spacing:8px;
}

.intro p{
    color:#aaa0b1;
    line-height:2;
    margin-bottom:25px;
}

.enter,
.btn{
    border:1px solid rgba(215,197,140,.35);
    background:rgba(255,255,255,.06);
    color:#eee5d9;
    border-radius:999px;
    padding:11px 20px;
    transition:.25s;
}

.enter:hover,
.btn:hover{
    background:rgba(255,255,255,.13);
    transform:translateY(-2px);
}

/* =========================
   主界面
========================= */

main{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.top{
    position:fixed;
    top:18px;
    left:22px;
    right:22px;
    display:flex;
    justify-content:space-between;
    font-size:10px;
    letter-spacing:3px;
    color:#a69aaa;
}

/* =========================
   星星瓶
========================= */

.bottle{
    position:relative;
    width:min(440px,90vw);
    height:min(640px,72vh);
    filter:
        drop-shadow(0 30px 55px rgba(0,0,0,.75))
        drop-shadow(0 0 35px rgba(153,120,220,.1));
    transform-origin:center center;
    will-change:transform;
}

#glass{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
}

#stars{
    position:absolute;
    left:16%;
    right:16%;
    top:25%;
    bottom:7%;
    overflow:hidden;
    border-radius:40% 40% 18% 18%;
    z-index:2;
}

/* 星星 */

.star{
    position:absolute;
    width:20px;
    height:20px;

    clip-path:polygon(
        50% 0,
        61% 35%,
        100% 35%,
        69% 57%,
        81% 100%,
        50% 73%,
        19% 100%,
        31% 57%,
        0 35%,
        39% 35%
    );

    background:var(--c);

    box-shadow:
        0 0 10px var(--c),
        0 0 24px var(--c),
        0 0 42px color-mix(in srgb,var(--c),transparent 50%);

    cursor:pointer;

    will-change:
        left,
        top,
        transform;

    transition:
        filter .2s ease;
}

.star:hover{
    filter:brightness(1.5);
}

/* 拖尾 */

.trail{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--c);
    box-shadow:0 0 12px var(--c);
    pointer-events:none;
    animation:trailFade .6s forwards;
}

@keyframes trailFade{
    to{
        opacity:0;
        transform:scale(.1);
    }
}

/* =========================
   数据
========================= */

.stats{
    display:flex;
    gap:28px;
    color:#aaa0b0;
    font-size:12px;
}

.stats b{
    color:#e9d68d;
    font-size:18px;
    font-weight:400;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
    justify-content:center;
}

/* =========================
   弹窗
========================= */

.panel{
    position:fixed;
    inset:0;
    z-index:50;
    background:rgba(5,4,11,.9);
    backdrop-filter:blur(18px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
}

.panel.open{
    display:flex;
}

.card{
    width:min(650px,95vw);
    max-height:92vh;
    overflow:auto;
    background:#f7eee2;
    color:#352b31;
    border-radius:28px;
    padding:24px;
    box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.card h2{
    font-weight:400;
    letter-spacing:2px;
}

.x{
    float:right;
    border:0;
    background:none;
    font-size:25px;
    color:#777;
}

/* =========================
   六种情绪
========================= */

.emotions{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:7px;
}

.emotion{
    border:1px solid #d2c4ba;
    background:#fff;
    border-radius:14px;
    padding:8px 2px;
    font-size:11px;
    color:#463940;
    transition:.2s;
}

.emotion:hover{
    transform:translateY(-2px);
}

.emotion.on{
    outline:2px solid var(--c);
    box-shadow:0 0 14px var(--c);
}

.dot{
    width:22px;
    height:22px;
    border-radius:50%;
    margin:auto auto 5px;
    background:var(--c);
    box-shadow:
        0 0 8px var(--c),
        0 0 18px var(--c);
}

/* =========================
   写信
========================= */

textarea{
    width:100%;
    height:300px;
    margin-top:12px;
    border:0;
    outline:0;
    resize:none;

    background:
        repeating-linear-gradient(
            transparent 0 39px,
            #ded1c5 40px
        );

    font:
        17px/40px Georgia,
        "PingFang SC",
        serif;

    color:#352b31;
}

textarea::placeholder{
    color:#aa9c9d;
}

.sign{
    text-align:center;
    margin:10px;
}

.sign button{
    border:1px solid #c8bbb2;
    background:#fff;
    border-radius:99px;
    padding:8px 17px;
    margin:0 3px;
}

.sign .on{
    background:#3b2c38;
    color:#fff;
}

.row{
    text-align:center;
}

.primary{
    border:0;
    border-radius:99px;
    background:#3b2c38;
    color:#fff;
    padding:11px 22px;
}

/* =========================
   信件
========================= */

.note{
    padding:15px 0;
    border-bottom:1px solid #ded2c8;
}

.tag{
    display:inline-block;

.who{

    color:#88747e;

.note p{

.note small{

.status{
    position:fixed;
    bottom:15px;
    right:16px;

@media(max-width:520px){

    .emotions{

    }

        font-size:31px;
    }

    .bottle{
        width:94vw;
        height:68vh;
    }

    .top{
        font-size:8px;
    }
}
</style>
</head>

<script>

/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =
    "https://fgerhmqwqflgggnqpuas.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_qkiY07ycZktk7tzeEfjT2g_C6hjmpSi";

const ROOM =
    "ink-yyi";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ============================================================
   基础变量
============================================================ */

const $ =
    id => document.getElementById(id);

const EMOTIONS = [

    {
        name:"开心",
        color:"#f4d24f",
        key:"happy"
    },

    {
        name:"难过",
        color:"#78a9df",
        key:"sad"
    },

    {
        name:"生气",
        color:"#ef5a4f",
        key:"angry"
    },

    {
        name:"平静",
        color:"#79c8b1",
        key:"calm"
    },

    {
        name:"焦虑",
        color:"#b58bd8",
        key:"anxious"
    },

    {
        name:"想念",
        color:"#8c78e8",
        key:"miss"
    }

];

let emotionIndex = 0;

let currentWho = "Ink";

let letters = [];

let stars = [];

let physicsReady = false;

let engine = null;

let physicsBodies = [];

let animationStarted = false;

let audioContext = null;

let audioMaster = null;

let audioSources = [];

let lastShake = 0;


/* ============================================================
   工具
============================================================ */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function setStatus(text){

    $("status").textContent =
        text;

}


/* ============================================================
   AUDIO
============================================================ */

function stopAudio(){

    if(audioContext){

        try{
            audioContext.close();
        }catch(e){}

    }

    audioContext = null;

    audioMaster = null;

    audioSources = [];

}


function resumeAudio(){

    try{

        if(
            audioContext &&
            audioContext.state === "suspended"
        ){

            audioContext.resume();

        }

    }catch(e){}

}


function createNoiseBuffer(){

    const buffer =
        audioContext.createBuffer(
            1,
            audioContext.sampleRate * 2,
            audioContext.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for(
        let i = 0;
        i < data.length;
        i++
    ){

        data[i] =
            Math.random() * 2 - 1;

    }

    return buffer;

}


function startEmotionAudio(key){

    stopAudio();

    try{

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioCtx){

            return;

        }

        audioContext =
            new AudioCtx();

        audioMaster =
            audioContext.createGain();

        audioMaster.gain.value =
            0.16;

        audioMaster.connect(
            audioContext.destination
        );

        /*
         * 六种情绪完全不同的声音结构
         */

        const profiles = {

            happy:{
                tones:[523.25,659.25,783.99],
                type:"sine",
                volume:.045
            },

            sad:{
                tones:[196,246.94,293.66],
                type:"sine",
                volume:.032
            },

            angry:{
                tones:[73.42,92.5,110],
                type:"sawtooth",
                volume:.035
            },

            calm:{
                tones:[174.61,220,261.63],
                type:"sine",
                volume:.032
            },

            anxious:{
                tones:[146.83,220,329.63],
                type:"triangle",
                volume:.035
            },

            miss:{
                tones:[261.63,329.63,392],
                type:"sine",
                volume:.035
            }

        };

        const profile =
            profiles[key] ||
            profiles.calm;


        /*
         * 主旋律层
         */

        profile.tones.forEach(
            (frequency,index)=>{

                const oscillator =
                    audioContext.createOscillator();

                const gain =
                    audioContext.createGain();

                oscillator.type =
                    profile.type;

                oscillator.frequency.value =
                    frequency;

                gain.gain.value =
                    profile.volume;

                oscillator.connect(gain);

                gain.connect(
                    audioMaster
                );

                oscillator.start();

                audioSources.push(
                    oscillator,
                    gain
                );

                /*
                 * 缓慢 LFO
                 */

                const lfo =
                    audioContext.createOscillator();

                const lfoGain =
                    audioContext.createGain();

                lfo.frequency.value =
                    0.08 +
                    index * 0.04;

                lfoGain.gain.value =
                    8;

                lfo.connect(
                    lfoGain
                );

                lfoGain.connect(
                    oscillator.frequency
                );

                lfo.start();

                audioSources.push(
                    lfo,
                    lfoGain
                );

            }
        );


        /*
         * 难过：
         * 雨声 + 白噪音
         */

        if(key === "sad"){

            const rain =
                audioContext.createBufferSource();

            const rainGain =
                audioContext.createGain();

            const filter =
                audioContext.createBiquadFilter();

            rain.buffer =
                createNoiseBuffer();

            rain.loop =
                true;

            filter.type =
                "lowpass";

            filter.frequency.value =
                2800;

            rainGain.gain.value =
                .11;

            rain.connect(filter);

            filter.connect(rainGain);

            rainGain.connect(
                audioMaster
            );

            rain.start();

            audioSources.push(
                rain,
                rainGain,
                filter
            );

        }


        /*
         * 开心：
         * 轻微空气感
         */

        if(key === "happy"){

            const noise =
                audioContext.createBufferSource();

            const gain =
                audioContext.createGain();

            const filter =
                audioContext.createBiquadFilter();

            noise.buffer =
                createNoiseBuffer();

            noise.loop =
                true;

            filter.type =
                "highpass";

            filter.frequency.value =
                1800;

            gain.gain.value =
                .025;

            noise
                .connect(filter)
                .connect(gain)
                .connect(audioMaster);

            noise.start();

            audioSources.push(
                noise,
                gain,
                filter
            );

        }


        /*
         * 焦虑：
         * 快速脉冲
         */

        if(key === "anxious"){

            const pulse =
                audioContext.createOscillator();

            const pulseGain =
                audioContext.createGain();

            pulse.type =
                "triangle";

            pulse.frequency.value =
                7;

            pulseGain.gain.value =
                .025;

            pulse.connect(
                pulseGain
            );

            pulseGain.connect(
                audioMaster.gain
            );

            pulse.start();

            audioSources.push(
                pulse,
                pulseGain
            );

        }


        audioContext.resume();

    }catch(error){

        console.warn(
            "Audio error:",
            error
        );

    }

}

============================================================ */

function clearEffects(){

    $("fx").innerHTML = "";

    $("world").style.background =
        "radial-gradient(circle at 50% 38%,#302640 0%,#0a080f 68%,#030207 100%)";

    stopAudio();

}


function createParticles(
    className,
    color,
    count
){

    for(
        let i = 0;
        i < count;
        i++
    ){

        const element =
            document.createElement("i");

        element.className =
            "p " + className;

        element.style.left =
            Math.random() * 100 + "%";

        element.style.top =
            Math.random() * 100 + "%";

        element.style.color =
            color;

        if(
            className === "rain"
        ){

            element.style.animationDuration =
                (.3 + Math.random() * .7) +
                "s";

        }else if(
            className === "wave"
        ){

            element.style.animationDuration =
                (3 + Math.random() * 3) +
                "s";

        }else{

            element.style.animationDuration =
                (1.8 + Math.random() * 4) +
                "s";

        }

        element.style.animationDelay =
            (-Math.random() * 5) +
            "s";

        $("fx").appendChild(
            element
        );

    }

}

/* ============================================================
   MATTER PHYSICS
============================================================ */

function initPhysics(){

    if(
        typeof Matter === "undefined"
    ){

        physicsReady =
            false;

        console.warn(
            "Matter.js failed to load."
        );

        return;

    }


    const {
        Engine,
        Runner,
        World,
        Bodies
    } = Matter;


    engine =
        Engine.create({

            enableSleeping:false

        });


    engine.gravity.x =
        0;

    engine.gravity.y =
        .45;


    const container =
        $("stars");


    const width =
        container.clientWidth ||
        300;

    const height =
        container.clientHeight ||
        400;


    const wall =
        20;


    const wallOptions = {

        isStatic:true,

        restitution:.9,

        friction:.02

    };


    physicsBodies = [

        Bodies.rectangle(
            width / 2,
            -wall / 2,
            width,
            wall,
            wallOptions
        ),

        Bodies.rectangle(
            width / 2,
            height + wall / 2,
            width,
            wall,
            wallOptions
        ),

        Bodies.rectangle(
            -wall / 2,
            height / 2,
            wall,
            height,
            wallOptions
        ),

        Bodies.rectangle(
            width + wall / 2,
            height / 2,
            wall,
            height,
            wallOptions
        )

    ];


    World.add(
        engine.world,
        physicsBodies
    );


    Runner.run(
        Runner.create(),
        engine
    );


    physicsReady =
        true;

}


/* ============================================================
   建立星星
============================================================ */

function createPhysicsStars(){

    if(
        !physicsReady ||
        typeof Matter === "undefined"
    ){

        return;

    }


    const {
        World,
        Bodies,
        Body
    } = Matter;


    const container =
        $("stars");


    const width =
        container.clientWidth;

    const height =
        container.clientHeight;


    /*
     * 删除旧动态星星
     */

    physicsBodies
        .filter(body=>!body.isStatic)
        .forEach(body=>{

            World.remove(
                engine.world,
                body
            );

        });


    physicsBodies =
        physicsBodies.filter(
            body=>body.isStatic
        );


    /*
     * 每封信对应一颗星
     */

    stars.forEach(
        (star,index)=>{

            const x =
                width *
                (star.x / 100);

            const y =
                height *
                (star.y / 100);


            const body =
                Bodies.circle(
                    x,
                    y,
                    10,
                    {

                        restitution:.92,

                        friction:.01,

                        frictionAir:.004,

                        density:.006,

                        inertia:Infinity

                    }
                );


            body.starId =
                star.id;

            body.starColor =
                star.color;


            Body.setVelocity(
                body,
                {

                    x:
                        (Math.random() - .5) *
                        .5,

                    y:
                        (Math.random() - .5) *
                        .3

                }
            );


            Body.setAngularVelocity(
                body,
                (Math.random() - .5) *
                .04
            );


            physicsBodies.push(
                body
            );


            World.add(
                engine.world,
                body
            );

        }
    );

}


/* ============================================================
   星星 DOM
============================================================ */

function renderStars(){

    const layer =
        $("stars");


    layer.innerHTML =
        "";


    letters.forEach(
        letter=>{

            const star =
                document.createElement("i");


            star.className =
                "star";


            star.style.setProperty(
                "--c",
                letter.color
            );


            star.dataset.id =
                letter.id;


            star.title =
                letter.emotion +

            star.onclick =
                ()=>{
                    showLetter(
                        letter
                    );
                };


            layer.appendChild(
                star
            );

        }
    );


    /*
     * 如果物理引擎已经启动，
     * 重新建立物理星星
     */

    if(physicsReady){

        createPhysicsStars();

    }

}


/* ============================================================
   物理动画同步 DOM
============================================================ */

function physicsLoop(){

    if(
        physicsReady &&
        typeof Matter !== "undefined"
    ){

        const dynamicBodies =
            physicsBodies.filter(
                body=>!body.isStatic
            );


        const elements =
            [
                ...$("stars").children
            ];


        dynamicBodies.forEach(
            (body,index)=>{

                const element =
                    elements[index];


                if(!element){
                    return;
                }


                const container =
                    $("stars");


                const x =
                    body.position.x /
                    container.clientWidth *
                    100;


                const y =
                    body.position.y /
                    container.clientHeight *
                    100;


                element.style.left =
                    x + "%";


                element.style.top =
                    y + "%";


                element.style.transform =
                    `
                    translate(-50%,-50%)
                    rotate(${body.angle}rad)
                    `;


                /*
                 * 拖尾
                 */

                if(
                    Math.random() < .22
                ){

                    const trail =
                        document.createElement("i");


                    trail.className =
                        "trail";


                    trail.style.setProperty(
                        "--c",
                        body.starColor
                    );


                    trail.style.left =
                        x + "%";


                    trail.style.top =
                        y + "%";


                    container.appendChild(
                        trail
                    );


                    setTimeout(
                        ()=>{
                            trail.remove();
                        },
                        600
                    );

                }

            }
        );

    }


    requestAnimationFrame(
        physicsLoop
    );

}


/* ============================================================
   摇一摇
============================================================ */

function shakeBottle(power=1){

    const now =
        performance.now();


    if(
        now - lastShake < 250
    ){

        return;

    }


    lastShake =
        now;


    /*
     * 真正给每颗星施加物理力
     */

    if(
        physicsReady &&
        typeof Matter !== "undefined"
    ){

        const {
            Body
        } = Matter;


        physicsBodies
            .filter(body=>!body.isStatic)
            .forEach(body=>{

                Body.applyForce(
                    body,
                    body.position,
                    {

                        x:
                            (Math.random() - .5) *
                            .055 *
                            power,

                        y:
                            -(
                                .035 +
                                Math.random() * .045
                            ) *
                            power

                    }
                );


                Body.setAngularVelocity(
                    body,
                    (Math.random() - .5) *
                    .35 *
                    power
                );

            });

    }


    /*
     * 瓶子本身晃动
     */

    $("bottle").animate(

        [

            {
                transform:
                    "translateX(0) rotate(0deg)"
            },

            {
                transform:
                    "translateX(-14px) rotate(-4deg)"
            },

            {
                transform:
                    "translateX(16px) rotate(4deg)"
            },

            {
                transform:
                    "translateX(-9px) rotate(-3deg)"
            },

            {
                transform:
                    "translateX(6px) rotate(2deg)"
            },

            {
                transform:
                    "translateX(0) rotate(0deg)"
            }

        ],

        {

            duration:950,

            easing:
                "cubic-bezier(.2,.8,.2,1)"

        }

    );


    resumeAudio();


    /*
     * 手机震动
     */

    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            [40,30,70]
        );

    }

}


/* ============================================================
   手机真实摇动
============================================================ */

let lastAcceleration = 0;

window.addEventListener(
    "devicemotion",
    event=>{

        const acceleration =
            event.accelerationIncludingGravity;


        if(!acceleration){
            return;
        }


        const x =
            acceleration.x || 0;

        const y =
            acceleration.y || 0;

        const z =
            acceleration.z || 0;


        const magnitude =
            Math.sqrt(
                x*x +
                y*y +
                z*z
            );


        if(
            magnitude > 20 &&
            magnitude - lastAcceleration > 7
        ){

            shakeBottle(.8);

        }


        lastAcceleration =
            magnitude;

    }
);


/* ============================================================
   云端
============================================================ */

async function loadLetters(){

    try{

        const result =
            await db
                .from("star_letters")
                .select("*")
                .eq("room",ROOM)
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                );


        if(result.error){

            console.error(
                result.error
            );

            setStatus(
                "● 云端连接失败"
            );

            return;

        }


        letters =
            result.data || [];


        renderAll();


        /*
         * Realtime
         */

        db
            .channel(
                "star-bottle-room"
            )
            .on(
                "postgres_changes",
                {

                    event:"INSERT",

                    schema:"public",

                    table:"star_letters",

                    filter:
                        "room=eq." + ROOM

                },

                payload=>{

                    const newLetter =
                        payload.new;


                    if(
                        letters.some(
                            item =>
                                item.id ===
                                newLetter.id
                        )
                    ){

                        return;

                    }


                    letters.push(
                        newLetter
                    );


                    renderAll();


                    /*
                     * 新星星出现时轻微闪光
                     */

                    const previous =
                        emotionIndex;


                    const found =
                        EMOTIONS.findIndex(
                            e =>
                                e.name ===
                                newLetter.emotion
                        );


                    if(found >= 0){

                        emotionIndex =
                            found;

                        startEmotionEffect();


                        setTimeout(
                            ()=>{
                                emotionIndex =
                                    previous;

                                clearEffects();
                            },
                            900
                        );

                    }

                }
            )
            .subscribe(
                state=>{

                    if(
                        state ===
                        "SUBSCRIBED"
                    ){

                        setStatus(
                            "● 已连接 · 两个人共享同一瓶星星"
                        );

                    }

                }
            );

    }catch(error){

        console.error(
            error
        );

        setStatus(
            "● 云端连接失败"
        );

    }

}


/* ============================================================
   保存信件
============================================================ */

async function saveLetter(){

    const text =
        $("text").value.trim();


    if(!text){

        return;

    }


    const emotion =
        EMOTIONS[
            emotionIndex
        ];


    const row = {

        room:ROOM,

        text:text,

        emotion:
            emotion.name,

        color:
            emotion.color,

        who:
            currentWho

    };


    setStatus(
        "● 正在保存星星……"
    );


    const result =
        await db
            .from("star_letters")
            .insert(row)
            .select()
            .single();


    if(result.error){

        console.error(
            result.error
        );

        setStatus(
            "● 保存失败，请检查网络"
        );

        return;

    }


    /*
     * Realtime 通常会收到，
     * 但如果当前客户端没有收到，
     * 自己先补进去。
     */

    if(
        result.data &&
        !letters.some(
            x =>
                x.id ===
                result.data.id
        )
    ){

        letters.push(
            result.data
        );

    }


    $("text").value =
        "";


    closeComposer();


    clearEffects();


    renderAll();


    setStatus(
        "● 星星已经留下"
    );

}

                    currentWho =
                        button.dataset.who;

/* ============================================================
   事件
============================================================ */

$("enter").onclick =
    async ()=>{

        /*
         * 用户第一次点击页面，
         * 此时允许浏览器启动声音。
         */

        try{

            const AudioCtx =
                window.AudioContext ||
                window.webkitAudioContext;

            if(AudioCtx){

                audioContext =
                    new AudioCtx();

                await audioContext.resume();

                audioContext.close();

                audioContext =
                    null;

            }

        }catch(e){}


        $("gate").classList.add(
            "hide"
        );


        /*
         * 物理引擎失败也不能阻止页面打开
         */

        try{

            initPhysics();

        }catch(error){

            console.warn(
                error
            );

            physicsReady =
                false;

        }


        /*
         * 加载云端
         */

        loadLetters();


        /*
         * 启动星星动画
         */

        if(!animationStarted){

            animationStarted =
                true;

            requestAnimationFrame(
                physicsLoop
            );

        }

    };

/* ============================================================
   窗口变化
============================================================ */

window.addEventListener(
    "resize",
    ()=>{
        /*
         * 不重新创建整个 Matter 引擎，
         * 避免移动端旋转导致多个物理世界叠加。
         */

        if(
            physicsReady &&
            typeof Matter !== "undefined"
        ){

            const container =
                $("stars");

            const width =
                container.clientWidth;

            const height =
                container.clientHeight;


            const staticBodies =
                physicsBodies.filter(
                    body=>body.isStatic
                );


            if(
                staticBodies.length === 4
            ){

                Matter.Body.setPosition(
                    staticBodies[0],
                    {
                        x:width/2,
                        y:-10
                    }
                );


                Matter.Body.setPosition(
                    staticBodies[1],
                    {
                        x:width/2,
                        y:height+10
                    }
                );


                Matter.Body.setPosition(
                    staticBodies[2],
                    {
                        x:-10,
                        y:height/2
                    }
                );


                Matter.Body.setPosition(
                    staticBodies[3],
                    {
                        x:width+10,
                        y:height/2
                    }
                );

            }

        }

    }
);
