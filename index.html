<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<title>Ink × Yyi · Our Star Bottle</title>

<!--
  两个 CDN 都使用 defer。
  即使其中一个加载失败，也不会阻止页面本身启动。
-->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    font-family:
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "PingFang SC",
        serif;

    color:#fff;
    background:#07060d;
}

button,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

#world{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 38%,
            #302640 0%,
            #0a080f 68%,
            #030207 100%
        );

    transition:
        background 1s ease;
}

#vignette{
    position:absolute;
    inset:-10%;
    z-index:10;
    pointer-events:none;

    background:
        radial-gradient(
            circle,
            transparent 38%,
            rgba(0,0,0,.78) 100%
        );
}

#fx{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

/* =========================================================
   开场
========================================================= */

#gate{
    position:fixed;
    inset:0;
    z-index:9999;

    display:grid;
    place-items:center;

    background:
        radial-gradient(
            circle at 50% 40%,
            #30253f,
            #08070d 72%
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#gate.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.intro{
    width:min(90vw,520px);
    text-align:center;
}

.big{
    font-size:90px;
    line-height:1;
    color:#e9d98f;

    text-shadow:
        0 0 18px #e9d98f,
        0 0 55px rgba(233,217,143,.6);

    animation:
        breathe 4s ease-in-out infinite;
}

@keyframes breathe{

    50%{
        transform:
            translateY(-8px)
            scale(1.05);

        opacity:.72;
    }

}

.intro h1{
    margin:18px 0 10px;

    font-size:38px;
    font-weight:400;

    letter-spacing:8px;
}

.intro p{
    margin:0 0 28px;

    color:#aaa0b1;
    line-height:2;
}

.enter{
    border:
        1px solid
        rgba(215,197,140,.4);

    background:
        rgba(255,255,255,.07);

    color:#eee5d9;

    border-radius:999px;

    padding:
        13px 25px;

    transition:
        .25s;
}

.enter:hover{
    background:
        rgba(255,255,255,.15);

    transform:
        translateY(-2px);

    box-shadow:
        0 0 25px
        rgba(220,200,140,.16);
}

.enter:active{
    transform:
        scale(.97);
}

/* =========================================================
   主界面
========================================================= */

main{
    position:relative;
    z-index:20;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.top{
    position:fixed;

    top:
        max(16px,env(safe-area-inset-top));

    left:22px;
    right:22px;

    display:flex;
    justify-content:space-between;

    color:#a69aaa;

    font-size:10px;
    letter-spacing:3px;
}

/* =========================================================
   瓶子
========================================================= */

.bottle{
    position:relative;

    width:min(440px,90vw);
    height:min(640px,72vh);

    transform-origin:center;

    filter:
        drop-shadow(
            0 30px 55px
            rgba(0,0,0,.75)
        )
        drop-shadow(
            0 0 35px
            rgba(153,120,220,.12)
        );

    will-change:
        transform;
}

#glass{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}

#stars{
    position:absolute;

    left:16%;
    right:16%;
    top:25%;
    bottom:7%;

    z-index:3;

    overflow:hidden;

    border-radius:
        40%
        40%
        18%
        18%;
}

/* =========================================================
   星星
========================================================= */

.star{
    position:absolute;

    width:20px;
    height:20px;

    background:
        var(--c);

    clip-path:
        polygon(
            50% 0,
            61% 35%,
            100% 35%,
            69% 57%,
            81% 100%,
            50% 73%,
            19% 100%,
            31% 57%,
            0 35%,
            39% 35%
        );

    box-shadow:
        0 0 9px var(--c),
        0 0 22px var(--c),
        0 0 42px var(--c);

    will-change:
        left,
        top,
        transform;

    cursor:pointer;
}

.star:hover{
    filter:
        brightness(1.5);
}

/* =========================================================
   拖尾
========================================================= */

.trail{
    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:
        var(--c);

    box-shadow:
        0 0 12px var(--c);

    pointer-events:none;

    animation:
        trailFade .6s forwards;
}

@keyframes trailFade{

    to{
        opacity:0;
        transform:scale(.08);
    }

}

/* =========================================================
   数据
========================================================= */

.stats{
    display:flex;
    gap:28px;

    color:#aaa0b0;

    font-size:12px;
}

.stats b{
    color:#e9d68d;

    font-size:18px;
    font-weight:400;
}

.actions{
    display:flex;
    gap:8px;

    margin-top:12px;

    flex-wrap:wrap;
    justify-content:center;
}

.btn{
    border:
        1px solid
        rgba(215,197,140,.35);

    background:
        rgba(255,255,255,.06);

    color:#eee5d9;

    border-radius:999px;

    padding:
        10px 18px;

    transition:.25s;
}

.btn:hover{
    background:
        rgba(255,255,255,.13);

    transform:
        translateY(-2px);
}

.btn:active{
    transform:
        scale(.97);
}

/* =========================================================
   特效
========================================================= */

.p{
    position:absolute;
    pointer-events:none;
}

/* 雨 */

.rain{
    width:1px;
    height:85px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(220,240,255,.95)
        );

    opacity:.55;

    animation:
        rainFall linear infinite;
}

@keyframes rainFall{

    from{
        transform:
            translate3d(
                0,
                -120px,
                0
            )
            rotate(10deg);
    }

    to{
        transform:
            translate3d(
                -120px,
                120vh,
                0
            )
            rotate(10deg);
    }

}

/* 火 */

.ember{
    width:4px;
    height:18px;

    border-radius:50%;

    background:#ff634f;

    box-shadow:
        0 0 8px #ff4a38,
        0 0 24px #ff321f;

    animation:
        emberUp linear infinite;
}

@keyframes emberUp{

    from{
        transform:
            translate3d(
                0,
                110vh,
                0
            )
            rotate(0);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    to{
        transform:
            translate3d(
                -60px,
                -20vh,
                0
            )
            rotate(180deg);

        opacity:0;
    }

}

/* 星光 */

.spark{
    width:4px;
    height:4px;

    border-radius:50%;

    background:
        currentColor;

    box-shadow:
        0 0 15px currentColor;

    animation:
        sparkMove linear infinite;
}

@keyframes sparkMove{

    0%{
        transform:
            translate3d(
                0,
                20px,
                0
            )
            scale(.5);

        opacity:0;
    }

    30%{
        opacity:1;
    }

    60%{
        transform:
            translate3d(
                30px,
                -40px,
                0
            )
            scale(1.7);
    }

    100%{
        transform:
            translate3d(
                -25px,
                -120vh,
                0
            )
            scale(.2);

        opacity:0;
    }

}

/* 平静水波 */

.wave{
    width:20px;
    height:20px;

    border:
        1px solid
        currentColor;

    border-radius:50%;

    animation:
        waveExpand ease-out infinite;
}

@keyframes waveExpand{

    0%{
        opacity:.65;

        transform:
            translate(-50%,-50%)
            scale(.1);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(35);
    }

}

/* 焦虑风 */

.wind{
    width:35vw;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            currentColor,
            transparent
        );

    box-shadow:
        0 0 8px currentColor;

    animation:
        windMove linear infinite;
}

@keyframes windMove{

    from{
        transform:
            translateX(-100vw);
    }

    to{
        transform:
            translateX(180vw);
    }

}

/* =========================================================
   弹窗
========================================================= */

.panel{
    position:fixed;
    inset:0;

    z-index:500;

    display:none;

    align-items:center;
    justify-content:center;

    padding:16px;

.card{

}

.card h2{

}

.x{
    float:right;

}

/* =========================================================
   情绪
========================================================= */

.emotions{
    display:grid;

    grid-template-columns:
        repeat(6,1fr);

    gap:7px;
}

.emotion{
    border:
        1px solid
        #d2c4ba;

    background:#fff;

    border-radius:14px;

    padding:8px 2px;

    font-size:11px;

    color:#463940;

    transition:.2s;
}

.emotion.on{
    outline:
        2px solid
        var(--c);

    box-shadow:
        0 0 14px
        var(--c);
}

.dot{
    width:22px;
    height:22px;

    margin:
        0 auto 5px;

    border-radius:50%;

    background:
        var(--c);

    box-shadow:
        0 0 8px var(--c),
        0 0 18px var(--c);
}

/* =========================================================
   写信
========================================================= */

textarea{
    width:100%;
    height:300px;

    margin-top:12px;

    border:0;
    outline:0;

    resize:none;

    background:
        repeating-linear-gradient(
            transparent 0 39px,
            #ded1c5 40px
        );

    font:
        17px/40px Georgia,
        "PingFang SC",
        serif;

    color:#352b31;
}

textarea::placeholder{
    color:#aa9c9d;
}

.sign{
    text-align:center;
    margin:10px;
}

.sign button{
    border:
        1px solid
        #c8bbb2;

    background:#fff;

    border-radius:99px;

    padding:
        8px 17px;

    margin:0 3px;
}

.sign button.on{
    background:#3b2c38;
    color:#fff;
}

.row{
    text-align:center;
}

.primary{
    border:0;

    border-radius:99px;

    background:#3b2c38;

    color:#fff;

    padding:
        11px 22px;
}

/* =========================================================
   信件
========================================================= */

.note{
    padding:
        15px 0;

    border-bottom:
        1px solid
        #ded2c8;
}

.tag{
    display:inline-block;

    padding:
        4px 9px;

    border-radius:99px;

    color:#fff;

    font-size:11px;
}

.who{
    float:right;
    color:#88747e;
}

.note p{
    white-space:pre-wrap;
    line-height:1.8;
}

.note small{
    color:#9b8c92;
}

.status{
    position:fixed;

    bottom:
        max(15px,env(safe-area-inset-bottom));

    right:16px;

    z-index:200;

    font-size:10px;

    color:#a69aaa;

    letter-spacing:1px;
}

@media(max-width:520px){

    .emotions{
        grid-template-columns:
            repeat(3,1fr);
    }

    .intro h1{
        font-size:31px;
    }

    .bottle{
        width:94vw;
        height:68vh;
    }

    .top{
        font-size:8px;
    }

}
</style>
</head>

<body>

<script>

/* =========================================================
   立即定义打开按钮
   这个函数不依赖任何外部 CDN。
========================================================= */

function openStarBottle(){

    var gate =
        document.getElementById("gate");

    if(gate){

        gate.classList.add("hide");

    }

    /*
     * 后续初始化全部使用 try/catch。
     * 任何一个模块失败，都不能阻止网页打开。
     */

    try{

        if(
            typeof window.startStarBottle ===
            "function"
        ){

            window.startStarBottle();

        }

    }catch(error){

        console.warn(
            "Star Bottle initialization:",
            error
        );

    }

}


/* =========================================================
   基础变量
========================================================= */

(function(){

"use strict";


var $ =
    function(id){
        return document.getElementById(id);
    };


var ROOM =
    "ink-yyi";


var SUPABASE_URL =
    "https://fgerhmqwqflgggnqpuas.supabase.co";


var SUPABASE_KEY =
    "sb_publishable_qkiY07ycZktk7tzeEfjT2g_C6hjmpSi";


var db = null;


var EMOTIONS = [

    {
        name:"开心",
        color:"#f4d24f",
        key:"happy"
    },

    {
        name:"难过",
        color:"#78a9df",
        key:"sad"
    },

    {
        name:"生气",
        color:"#ef5a4f",
        key:"angry"
    },

    {
        name:"平静",
        color:"#79c8b1",
        key:"calm"
    },

    {
        name:"焦虑",
        color:"#b58bd8",
        key:"anxious"
    },

    {
        name:"想念",
        color:"#8c78e8",
        key:"miss"
    }

];


var emotionIndex = 0;

var currentWho = "Ink";

var letters = [];

var engine = null;

var physicsBodies = [];

var physicsReady = false;

var animationStarted = false;

var audioContext = null;

var audioMaster = null;

var audioObjects = [];

var lastShake = 0;


/* =========================================================
   状态
========================================================= */

function setStatus(text){

    $("status").textContent =
        text;

}


/* =========================================================
   HTML 安全
========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   Supabase 初始化
========================================================= */

function initSupabase(){

    try{

        if(
            window.supabase &&
            typeof window.supabase.createClient ===
            "function"
        ){

            db =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );

            return true;

        }

    }catch(error){

        console.warn(
            "Supabase initialization failed:",
            error
        );

    }

    return false;

}


/* =========================================================
   云端读取
========================================================= */

async function loadCloud(){

    if(!db){

        setStatus(
            "● 云端未连接 · 本地模式"
        );

        return;

    }


    try{

        var result =
            await db
                .from("star_letters")
                .select("*")
                .eq("room",ROOM)
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                );


        if(result.error){

            console.warn(
                result.error
            );

            setStatus(
                "● 云端连接失败 · 网页仍可使用"
            );

            return;

        }


        letters =
            result.data || [];


        renderAll();


        /*
         * 双向实时同步
         */

        db

/* =========================================================
   音频
========================================================= */

function stopAudio(){

    audioObjects.forEach(
        function(item){

            try{

                if(item.stop){
                    item.stop();
                }

            }catch(e){}

        }
    );


    audioObjects = [];


    if(audioContext){

        try{
            audioContext.close();
        }catch(e){}

    }


    audioContext = null;

    audioMaster = null;

}


function resumeAudio(){

    try{

        if(
            audioContext &&
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

    }catch(e){}

}


function noiseBuffer(){

    var buffer =
        audioContext.createBuffer(
            1,
            audioContext.sampleRate * 2,
            audioContext.sampleRate
        );


    var data =
        buffer.getChannelData(0);


    for(
        var i=0;
        i<data.length;
        i++
    ){

        data[i] =
            Math.random()*2-1;

    }


    return buffer;

}


function startSound(key){

    stopAudio();


    try{

        var AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AudioContextClass){

            return;

        }


        audioContext =
            new AudioContextClass();


        audioMaster =
            audioContext.createGain();


        audioMaster.gain.value =
            .18;


        audioMaster.connect(
            audioContext.destination
        );


        var profiles = {

            happy:{
                tones:
                    [523.25,659.25,783.99],
                type:"sine",
                volume:.045
            },

            sad:{
                tones:
                    [196,246.94,293.66],
                type:"sine",
                volume:.032
            },

            angry:{
                tones:
                    [73.42,92.5,110],
                type:"sawtooth",
                volume:.035
            },

            calm:{
                tones:
                    [174.61,220,261.63],
                type:"sine",
                volume:.032
            },

            anxious:{
                tones:
                    [146.83,220,329.63],
                type:"triangle",
                volume:.035
            },

            miss:{
                tones:
                    [261.63,329.63,392],
                type:"sine",
                volume:.035
            }

        };


        var profile =
            profiles[key] ||
            profiles.calm;


        profile.tones.forEach(
            function(frequency,index){

                var osc =
                    audioContext.createOscillator();


                var gain =
                    audioContext.createGain();


                osc.type =
                    profile.type;


                osc.frequency.value =
                    frequency;


                gain.gain.value =
                    profile.volume;


                osc.connect(gain);

                gain.connect(
                    audioMaster
                );


                osc.start();


                audioObjects.push(
                    osc
                );


                /*
                 * 缓慢呼吸 LFO
                 */

                var lfo =
                    audioContext.createOscillator();


                var lfoGain =
                    audioContext.createGain();


                lfo.frequency.value =
                    .08 +
                    index*.035;


                lfoGain.gain.value =
                    7;


                lfo.connect(
                    lfoGain
                );


                lfoGain.connect(
                    osc.frequency
                );


                lfo.start();


                audioObjects.push(
                    lfo
                );

            }
        );


        /*
         * 难过：
         * 雨声 + 白噪音
         */

        if(key === "sad"){

            var rain =
                audioContext.createBufferSource();


            var rainGain =
                audioContext.createGain();


            var filter =
                audioContext.createBiquadFilter();


            rain.buffer =
                noiseBuffer();


            rain.loop =
                true;


            filter.type =
                "lowpass";


            filter.frequency.value =
                2800;


            rainGain.gain.value =
                .14;


            rain
                .connect(filter)
                .connect(rainGain)
                .connect(audioMaster);


            rain.start();


            audioObjects.push(
                rain
            );

        }


        /*
         * 开心：
         * 高空空气感
         */

        if(key === "happy"){

            var happyNoise =
                audioContext.createBufferSource();


            var happyGain =
                audioContext.createGain();


            var happyFilter =
                audioContext.createBiquadFilter();


            happyNoise.buffer =
                noiseBuffer();


            happyNoise.loop =
                true;


            happyFilter.type =
                "highpass";


            happyFilter.frequency.value =
                1600;


            happyGain.gain.value =
                .025;


            happyNoise
                .connect(happyFilter)
                .connect(happyGain)
                .connect(audioMaster);


            happyNoise.start();


            audioObjects.push(
                happyNoise
            );

        }


        /*
         * 生气：
         * 低频脉冲
         */

        if(key === "angry"){

            var angryOsc =
                audioContext.createOscillator();


            var angryGain =
                audioContext.createGain();


            angryOsc.type =
                "square";


            angryOsc.frequency.value =
                2.2;


            angryGain.gain.value =
                .018;


            angryOsc
                .connect(angryGain)
                .connect(audioMaster);


            angryOsc.start();


            audioObjects.push(
                angryOsc
            );

        }


        /*
         * 焦虑：
         * 快速颤动
         */

        if(key === "anxious"){

            var anxiousOsc =
                audioContext.createOscillator();


            var anxiousGain =
                audioContext.createGain();


            anxiousOsc.type =
                "triangle";


            anxiousOsc.frequency.value =
                6;


            anxiousGain.gain.value =
                .025;


            anxiousOsc
                .connect(anxiousGain)
                .connect(audioMaster);


            anxiousOsc.start();


            audioObjects.push(
                anxiousOsc
            );

        }


        audioContext.resume();

    }catch(error){

        console.warn(
            "Audio:",
            error
        );

    }

}

/* =========================================================
   Matter.js
========================================================= */

function initPhysics(){

    if(
        !window.Matter
    ){

        physicsReady =
            false;

        console.warn(
            "Matter.js unavailable"
        );

        return;

    }


    try{

        var Engine =
            Matter.Engine;

        var Runner =
            Matter.Runner;

        var World =
            Matter.World;

        var Bodies =
            Matter.Bodies;


        engine =
            Engine.create({
                enableSleeping:false
            });


        engine.gravity.x =
            0;


        engine.gravity.y =
            .45;


        var layer =
            $("stars");


        var width =
            layer.clientWidth ||
            300;


        var height =
            layer.clientHeight ||
            400;


        var wall =
            20;


        var options = {

            isStatic:true,

            restitution:.95,

            friction:.01

        };


        physicsBodies = [

            Bodies.rectangle(
                width/2,
                -wall/2,
                width,
                wall,
                options
            ),

            Bodies.rectangle(
                width/2,
                height+wall/2,
                width,
                wall,
                options
            ),

            Bodies.rectangle(
                -wall/2,
                height/2,
                wall,
                height,
                options
            ),

            Bodies.rectangle(
                width+wall/2,
                height/2,
                wall,
                height,
                options
            )

        ];


        World.add(
            engine.world,
            physicsBodies
        );


        Runner.run(
            Runner.create(),
            engine
        );


        physicsReady =
            true;


        rebuildMatterStars();

    }catch(error){

        console.warn(
            "Matter initialization:",
            error
        );

        physicsReady =
            false;

    }

}


/* =========================================================
   Matter 星星
========================================================= */

function rebuildMatterStars(){

    if(
        !physicsReady ||
        !window.Matter ||
        !engine
    ){

        return;

    }


    try{

        var World =
            Matter.World;

        var Bodies =
            Matter.Bodies;

        var Body =
            Matter.Body;


        physicsBodies
            .filter(
                function(body){
                    return !body.isStatic;
                }
            )
            .forEach(
                function(body){

                    World.remove(
                        engine.world,
                        body
                    );

                }
            );


        physicsBodies =
            physicsBodies.filter(
                function(body){
                    return body.isStatic;
                }
            );


        var layer =
            $("stars");


        var width =
            layer.clientWidth;


        var height =
            layer.clientHeight;


        letters.forEach(
            function(letter,index){

                var x =
                    width *
                    (.15 +
                    Math.random()*.7);


                var y =
                    height *
                    (.12 +
                    Math.random()*.7);


                var body =
                    Bodies.circle(
                        x,
                        y,
                        10,
                        {

                            restitution:.95,

                            friction:.01,

                            frictionAir:.004,

                            density:.006

                        }
                    );


                body.starColor =
                    letter.color;


                body.starId =
                    letter.id;


                Body.setVelocity(
                    body,
                    {

                        x:
                            (Math.random()-.5)*.5,

                        y:
                            (Math.random()-.5)*.3

                    }
                );


                Body.setAngularVelocity(
                    body,
                    (Math.random()-.5)*.08
                );


                physicsBodies.push(
                    body
                );


                World.add(
                    engine.world,
                    body
                );

            }
        );

    }catch(error){

        console.warn(
            "Matter stars:",
            error
        );

    }

}

/* =========================================================
   星星动画
========================================================= */

function physicsLoop(){

    try{

        if(
            physicsReady &&
            window.Matter &&
            physicsBodies.length
        ){

            var dynamic =
                physicsBodies.filter(
                    function(body){
                        return !body.isStatic;
                    }
                );


            var elements =
                Array.from(
                    $("stars").children
                );


            dynamic.forEach(
                function(body,index){

                    var element =
                        elements[index];


                    if(!element){
                        return;
                    }


                    var layer =
                        $("stars");


                    var x =
                        body.position.x /
                        layer.clientWidth *
                        100;


                    var y =
                        body.position.y /
                        layer.clientHeight *
                        100;


                    element.style.left =
                        x + "%";


                    element.style.top =
                        y + "%";


                    element.style.transform =
                        "translate(-50%,-50%) rotate(" +
                        body.angle +
                        "rad)";


                    if(
                        Math.random() < .18
                    ){

                        var trail =
                            document.createElement("i");


                        trail.className =
                            "trail";


                        trail.style.setProperty(
                            "--c",
                            body.starColor
                        );


                        trail.style.left =
                            x + "%";


                        trail.style.top =
                            y + "%";


                        layer.appendChild(
                            trail
                        );


                        setTimeout(
                            function(){
                                trail.remove();
                            },
                            600
                        );

                    }

                }
            );

        }

    }catch(error){

        console.warn(
            "Physics frame:",
            error
        );

    }


    requestAnimationFrame(
        physicsLoop
    );

}


/* =========================================================
   摇一摇
========================================================= */

function shakeBottle(power){

    power =
        power || 1;


    var now =
        Date.now();


    if(
        now-lastShake < 220
    ){

        return;

    }


    lastShake =
        now;


    if(
        physicsReady &&
        window.Matter
    ){

        try{

            var Body =
                Matter.Body;


            physicsBodies
                .filter(
                    function(body){
                        return !body.isStatic;
                    }
                )
                .forEach(
                    function(body){

                        Body.applyForce(
                            body,
                            body.position,
                            {

                                x:
                                    (Math.random()-.5) *
                                    .055 *
                                    power,

                                y:
                                    -(
                                        .035 +
                                        Math.random()*.045
                                    ) *
                                    power

                            }
                        );


                        Body.setAngularVelocity(
                            body,
                            (Math.random()-.5) *
                            .35 *
                            power
                        );

                    }
                );

        }catch(error){

            console.warn(
                error
            );

        }

    }


    /*
     * 即使物理引擎没加载，
     * 瓶子本身也会有明显摇动。
     */

    var bottle =
        $("bottle");


    if(bottle){

        bottle.animate(

            [

                {
                    transform:
                        "translateX(0) rotate(0)"
                },

                {
                    transform:
                        "translateX(-15px) rotate(-4deg)"
                },

                {
                    transform:
                        "translateX(17px) rotate(4deg)"
                },

                {
                    transform:
                        "translateX(-10px) rotate(-3deg)"
                },

                {
                    transform:
                        "translateX(6px) rotate(2deg)"
                },

                {
                    transform:
                        "translateX(0) rotate(0)"
                }

            ],

            {
                duration:950,
                easing:
                    "cubic-bezier(.2,.8,.2,1)"
            }

        );

    }


    resumeAudio();


    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            [45,30,70]
        );

    }

}


/* =========================================================
   手机摇一摇
========================================================= */

var lastMotion =
    0;


window.addEventListener(
    "devicemotion",
    function(event){

        var acceleration =
            event.accelerationIncludingGravity;


        if(!acceleration){
            return;
        }


        var x =
            acceleration.x || 0;


        var y =
            acceleration.y || 0;


        var z =
            acceleration.z || 0;


        var magnitude =
            Math.sqrt(
                x*x+y*y+z*z
            );


        var now =
            Date.now();


        if(
            magnitude > 20 &&
            now-lastMotion > 600
        ){

            lastMotion =
                now;


            shakeBottle(.8);

        }

    }
);

async function saveLetter(){

    var text =
        $("text").value.trim();


    if(!text){

        $("text").focus();

        return;

    }


    var emotion =
        EMOTIONS[
            emotionIndex
        ];


    var row = {

        room:ROOM,

        text:text,

        emotion:
            emotion.name,

        color:
            emotion.color,

        who:
            currentWho

    };


    setStatus(
        "● 正在把信折成星星……"
    );


    /*
     * 云端可用：
     * 保存到 Supabase
     */

    if(db){

        try{

            var result =
                await db
                    .from("star_letters")
                    .insert(row)
                    .select()
                    .single();


            if(
                result.error
            ){

                console.warn(
                    result.error
                );

                /*
                 * 云端失败仍然不丢信。
                 * 本地先保存。
                 */

                saveLocal(row);

            }else{

                if(
                    result.data &&
                    !letters.some(
                        function(item){
                            return item.id ===
                                result.data.id;
                        }
                    )
                ){

                    letters.push(
                        result.data
                    );

                }

            }

        }catch(error){

            console.warn(
                error
            );

            saveLocal(row);

        }

    }else{

        saveLocal(row);

    }


    $("text").value = "";


    closeComposer();


    renderAll();


    setStatus(
        "● 星星已经留下"
    );

}


function saveLocal(row){

    var localRow =
        Object.assign(
            {},
            row,
            {
                id:
                    "local-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(16)
                        .slice(2),

                created_at:
                    new Date()
                        .toISOString()
            }
        );


    letters.push(
        localRow
    );

}

                error
            );

        }


        /*
         * 云端
         */

        try{

            initSupabase();

            loadCloud();

        }catch(error){

            console.warn(
                "Cloud:",
                error
            );

        }


        /*
         * 动画
         */

        if(!animationStarted){

            animationStarted =
                true;

            requestAnimationFrame(
                physicsLoop
            );

        }


        setStatus(
            "● 星星瓶已打开"
        );

    };

document

    )

            button.onclick =

                    currentWho =
                        button.dataset.who;


                    document
                        .querySelectorAll(
